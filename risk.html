        <div class="tw">${matrixHTML(yearItems().filter((x) => isRoutine(x) && !x._carry), M)}</div></div>` : ''}
      <div class="grid2b">
        <div class="card"><div class="card-h"><h2>재해 유형별 위험요인</h2><span class="sub">1~${M}월 · 빨강 = 미결</span></div>
          ${hz.map(([k, v]) => `<div class="hbar clk" role="button" tabindex="0" data-hz="${esc(k)}" data-tip="${esc(k)} · 발굴 ${v.n}건 / 미결 ${v.open}건"><span>${esc(k)}</span><span class="track"><i style="width:${(v.n / hzMax) * 100}%"></i><i class="op" style="width:${(v.open / hzMax) * 100}%"></i></span><span class="v">${v.n}${v.open ? ` <span style="color:var(--hi)">(${v.open})</span>` : ''}</span></div>`).join('')}
          <div class="card-h" style="margin-top:16px"><h2>감소대책 유형</h2><span class="sub">① 근본적 → ④ 개인보호구 순으로 우선 · 한 항목에 여러 유형 가능</span></div>
          ${RA.CTLS.map(([k], i) => { const v = ctlCnt[k] || { n: 0, open: 0 }; return `<div class="hbar clk" role="button" tabindex="0" data-ctlgo="${k}" data-tip="${k} 대책 · ${v.n}건 / 미결 ${v.open}건"><span>${ctlNo(k)} ${k}</span><span class="track"><i class="ct c${i}" style="width:${(v.n / ctlMax) * 100}%"></i></span><span class="v">${v.n}</span></div>`; }).join('')}
          ${ctlNone ? `<div class="hbar clk" role="button" tabindex="0" data-ctlgo="미지정" data-tip="아직 유형을 고르지 않은 항목 · 눌러서 분류"><span>미지정</span><span class="track"><i class="op" style="width:${(ctlNone / ctlMax) * 100}%"></i></span><span class="v">${ctlNone}</span></div>` : ''}
        </div>
        <div class="card"><div class="card-h"><h2>반복 지적 개선대책</h2><span class="sub">같은 대책이 2회 이상 나온 항목</span></div>
          ${rep.length ? `<ol class="rep">${rep.map((r, i) => `<li class="clk" role="button" tabindex="0" data-rq="${esc(r.label)}"><span class="rk">${i + 1}</span><span class="tx" title="${esc(r.label)}">${esc(r.label)} <span class="small">· ${r.places.size}개 장소</span></span><span class="num">${r.n}건${r.open ? ` <span class="pill p-open">미결 ${r.open}</span>` : ''}</span></li>`).join('')}</ol><p class="small" style="margin:10px 0 0">반복되는 대책은 개별 조치보다 일괄 보수·교체 계획으로 묶는 편이 효과적입니다.</p>` : '<p class="small">반복 항목이 없습니다.</p>'}
        </div>
      </div>
      <div class="card"><div class="card-h"><h2>입력 점검</h2><span class="sub">취합 전에 바로잡을 항목</span></div>
        ${qc.length ? `<ul class="qlist">${qc.map((q) => `<li>${esc(q.k)} <b class="num">${q.list.length}건</b> <button class="btn sm ghost" data-qc="${esc(q.k)}">보기</button></li>`).join('')}</ul>` : '<div class="notice ok">점검 항목이 모두 정상입니다.</div>'}
      </div>
      </div></details>`;
    bindFocus($('#v-dash'));
    $('#dash-more').addEventListener('toggle', (e) => { S.more = e.target.open; lsSet('ra-more', S.more); });
    $('#sel-M').onchange = (e) => { S.M = +e.target.value; lsSet('ra-M', S.M); render(); };
    $$('[data-dtype]', $('#v-dash')).forEach((b) => (b.onclick = () => { S.dtype = b.dataset.dtype; lsSet('ra-dtype', S.dtype); render(); }));
    const ty = S.dtype === '전체' ? '' : S.dtype;
    const KG = { cur: { status: 'all', m: String(M) }, cum: { status: 'all' }, done: { status: 'done' }, open: { status: 'open' }, hi: { status: 'open', hi: true }, long: { status: 'open', long: true } };
    $$('[data-kgo]', $('#v-dash')).forEach((b) => (b.onclick = () => goAct(Object.assign({ type: ty }, KG[b.dataset.kgo]))));
    $$('[data-hz]', $('#v-dash')).forEach((b) => (b.onclick = () => goAct({ status: 'all', hz: b.dataset.hz, type: ty })));
    $$('[data-rq]', $('#v-dash')).forEach((b) => (b.onclick = () => goAct({ status: 'all', q: b.dataset.rq, type: ty })));
    $$('[data-ctlgo]', $('#v-dash')).forEach((b) => (b.onclick = () => (b.dataset.ctlgo === '미지정' && (isAdmin() || isSup()) ? openCtlClassifier(items.filter((x) => x.m <= M && !ctlOf(x).length)) : goAct({ status: 'all', ctl: b.dataset.ctlgo, type: ty }))));
    const gc = $('#go-carry'); if (gc) gc.onclick = () => { S.f = { status: 'open', team: '', dept: '', owner: '', m: '', hi: false, q: '', carry: true }; setView('act'); };
    $$('[data-bar]', $('#v-dash')).forEach((g) => { g.onmousemove = (e) => showTip(e, g.dataset.bar); g.onmouseleave = hideTip; });
    $('#btn-report').onclick = () => copyText(reportText(sum, M, items));
    const be = $('#btn-export'); if (be) be.onclick = () => exportExcel();
    $$('[data-goteam]', $('#v-dash')).forEach((a) => (a.onclick = (e) => { e.preventDefault(); S.f = Object.assign(S.f, { status: 'open', team: a.dataset.goteam, dept: '', owner: '', m: '', hi: false, q: '' }); setView('act'); }));
    $$('[data-qc]', $('#v-dash')).forEach((b) => (b.onclick = () => { const q = qc.find((x) => x.k === b.dataset.qc); if (q.k === '감소대책 유형 미지정') return openCtlClassifier(q.list); openList(q.k, q.list); }));
    $$('.mb', $('#v-dash')).forEach((g) => { g.onmousemove = (e) => { const i = +g.dataset.i; showTip(e, `<b>${i + 1}월</b><br>발굴 ${sum.tot.months[i]}건 · 개선 ${sum.tot.doneMonths[i]}건`); }; g.onmouseleave = hideTip; });
    $$('[data-tip]', $('#v-dash')).forEach((el) => { el.onmousemove = (e) => showTip(e, esc(el.dataset.tip)); el.onmouseleave = hideTip; });
  }
  function openList(title, list) {
    openModal(`<div class="modal-h"><h2>${esc(title)} · ${list.length}건</h2><button class="btn sm" data-close>닫기</button></div>${itemsTable(list.slice(0, 300))}`);
    bindItemRows($('#modal-box'));
  }

  // ---------- 항목 표 / 상세 ----------
  function thumbPair(x, big) {
    const im = (src, n, lbl) => (src ? `<span class="tbx"><img src="${src}" alt="${lbl}" loading="lazy">${n > 1 ? `<i>${n}</i>` : ''}</span>` : `<span class="tbx none">${lbl}<br>없음</span>`);
    if (!x.tb && !x.ta && !big) return '<span class="small">–</span>';
    return `<span class="tbp ${big ? 'big' : ''}">${im(x.tb, x.pb, '개선 전')}<b>→</b>${im(x.ta, x.pa, x.status === 'done' ? '개선 후' : '조치 전')}</span>`;
  }
  function photoCards(list) {
    if (!list.length) return '<p class="small">해당 항목이 없습니다.</p>';
    return `<div class="pcards">${list.map((x) => `<button class="pcard" data-id="${x.id}">
      <div class="pc-top"><span class="small">${x._carry ? `'${String(itemYear(x)).slice(2)}년 ` : ''}${x.m}월 · ${esc(x.team)}</span>${statusPill(x)}</div>
      <div class="pc-ph"><figure>${x.tb ? `<img src="${x.tb}" alt="개선 전" loading="lazy">` : '<div class="ph-none">사진 없음</div>'}<figcaption>개선 전${x.pb > 1 ? ` · ${x.pb}장` : ''}</figcaption></figure>
        <figure>${x.ta ? `<img src="${x.ta}" alt="개선 후" loading="lazy">` : `<div class="ph-none">${x.status === 'done' ? '사진 없음' : '조치 대기'}</div>`}<figcaption>개선 후${x.pa > 1 ? ` · ${x.pa}장` : ''}</figcaption></figure></div>
      <div class="pc-t"><b>${esc(x.place)}</b> · ${esc(x.haz)}</div><div class="small clip">${esc(x.sit)}</div><div class="small clip">→ ${esc(x.act)}</div>${ctlTags(x)}
      <div class="pc-b">${levelPill(x.r1)}<span class="small">담당 ${esc(x.dept || '미지정')}</span></div></button>`).join('')}</div>`;
  }
  function itemsTable(list) {
    if (!list.length) return '<p class="small">해당 항목이 없습니다.</p>';
    return `<div class="tw"><table class="items"><thead><tr><th>월</th><th>팀 · 구역</th><th>장소</th><th>위험요인 · 상황</th><th>위험성</th><th>개선대책</th><th>담당팀</th><th>상태</th><th>사진 (개선 전 → 후)</th></tr></thead><tbody>
      ${list.map((x) => `<tr class="clickable" data-id="${x.id}"><td class="num">${x._carry ? `<span class="small">'${String(itemYear(x)).slice(2)}년</span> ` : ''}${x.m}월${x._carry ? '<div><span class="pill p-hi">전년 이월</span></div>' : ''}${typePill(x)}</td><td><b>${esc(x.team)}</b><div class="small">${esc(zoneName(x.zone))}</div></td><td>${esc(x.place)}</td><td style="min-width:220px"><b>${esc(x.haz)}</b><div class="clip">${esc(x.sit)}</div></td><td>${levelPill(x.r1)}</td><td style="min-width:180px"><div class="clip">${esc(x.act)}</div>${ctlTags(x)}</td><td style="white-space:nowrap">${esc(x.dept)}</td><td>${statusPill(x)}</td><td>${thumbPair(x)}</td></tr>`).join('')}
    </tbody></table></div>`;
  }
  function bindItemRows(root) { $$('tr[data-id]', root).forEach((tr) => (tr.onclick = () => openItem(tr.dataset.id))); }
  async function openItem(id) {
    const it = S.items.find((x) => x.id === id); if (!it) return;
    const act = canAct(it), adm = isAdmin();
    openModal(`<div class="modal-h"><div><div class="small">${it.m}월 · ${esc(it.team)} · ${esc(zoneName(it.zone) || '구역 미지정')} <span class="pill p-src">${esc(it.src || '입력')}</span></div><h2 style="font-size:17px;margin-top:4px">${esc(it.place)} — ${esc(it.haz || '위험요인')}</h2></div><button class="btn sm" data-close>닫기</button></div>
      <dl class="kv">
        <dt>평가 종류</dt><dd>${itemYear(it)}년 ${typeLabel(it)} 위험성평가${isAdmin() && typeOf(it) === '상시' ? ` <label class="small" style="margin-left:8px"><input type="checkbox" id="d-also" ${typeIs(it, '정기') ? 'checked' : ''}> 정기 위험성평가에도 포함</label>` : ''}${it.trigger ? ` · ${esc(it.trigger)}` : ''}${it.accDate ? ` (${esc(it.accDate)})` : ''}${it.accNote ? `<div class="small">${esc(it.accNote)}</div>` : ''}${it.status === 'open' && itemYear(it) < CUR_Y ? '<div class="small" style="color:var(--hi)">전년도에 개선하지 못해 올해로 이월된 항목입니다</div>' : ''}</dd>
        ${(() => { const ac = (it.accId && S.acc.find((a) => a.id === it.accId)) || (!it.accId && typeOf(it) === '수시' && it.accDate && S.acc.find((a) => a.date === it.accDate)); return ac ? `<dt>연결된 사고</dt><dd><a href="#" data-goacc="${esc(ac.id)}">No.${esc(ac.no ?? '')} ${esc(ac.date)} · ${esc(ac.desc)}</a> ${clsPill(ac.cls)}</dd>` : ''; })()}
        <dt>분류</dt><dd>${esc(it.cat) || '<span class="small">없음</span>'}</dd>
        <dt>위험발생 상황</dt><dd>${esc(it.sit)}</dd>
        <dt>현재 위험성</dt><dd>빈도 ${it.f1 ?? '–'} × 강도 ${it.s1 ?? '–'} = ${levelPill(it.r1)}</dd>
        <dt>개선대책</dt><dd>${esc(it.act)}</dd>
        <dt>감소대책 유형</dt><dd id="d-ctl">${canEdit(it) ? ctlPicker('d-ctl', ctlOf(it), ctlOf(it).length ? '' : RA.suggestCtl(it.act)) + '<div class="small" id="d-ctl-msg">누르면 바로 저장됩니다.</div>' : ctlTags(it)}</dd>
        <dt>개선후 위험성</dt><dd>빈도 ${it.f2 ?? '–'} × 강도 ${it.s2 ?? '–'} = ${levelPill(it.r2)}</dd>
        <dt>담당팀</dt><dd>${esc(it.dept) || '미지정'} · 조치요구일 ${esc(it.due) || '–'}</dd>
        <dt>상태</dt><dd>${statusPill(it)} ${it.doneDate ? `<span class="small">완료일 ${esc(it.doneDate)}</span>` : ''} ${it.exReason ? `<span class="small">사유: ${esc(it.exReason)}</span>` : ''} ${it.doneNote ? `<div class="small">조치내용: ${esc(it.doneNote)}</div>` : ''}</dd>
        ${it.file ? `<dt>원본</dt><dd class="small">${esc(it.file)} ${it.row ? `· ${it.row}행` : ''}</dd>` : ''}
      </dl>
      <div id="ph"><span class="small">사진 확인 중…</span></div>
      ${act ? `<div class="card" style="background:var(--surface-2)">
        <div class="card-h"><h2>조치 처리</h2><span class="sub">${it.status === 'open' ? '개선을 마쳤으면 완료일과 사진을 남겨 주세요' : '상태를 되돌릴 수 있습니다'}</span></div>
        ${it.status === 'open' ? `<div class="fgrid">
          <label class="f">개선 완료일<input type="date" id="d-date" value="${RA.toISO({ y: TODAY.getFullYear(), m: TODAY.getMonth() + 1, d: TODAY.getDate() })}"></label>
          <label class="f s2">조치 내용<input type="text" id="d-note" placeholder="예: 유도등 배터리 교체 완료"></label>
          ${ppHTML('d', '개선 후 사진')}</div>
          <div class="row" style="margin-top:12px"><button class="btn pri" id="d-done">개선 완료 처리</button>
          ${adm ? `<input type="text" id="d-ex" placeholder="제외 사유 (예: 허용 가능 위험)" style="width:auto;flex:1;min-width:180px"><button class="btn" id="d-exbtn">제외 처리</button>` : ''}</div>`
          : `<button class="btn" id="d-reopen">미결로 되돌리기</button>`}
      </div>` : ''}
      <div class="row" style="justify-content:flex-end">
        ${canEdit(it) ? '<button class="btn" id="d-edit">내용 수정</button>' : ''}
        ${canDelete(it) ? '<button class="btn danger" id="d-del">삭제</button>' : ''}
      </div>`);
    const drawPh = () => store.getPhotos(id).then((p) => {
      const el = $('#ph'); if (!el) return;
      const grp = (kind, label, can) => `<div class="phg"><div class="phg-h"><b>${label}</b> <span class="small">${p[kind].length}장</span>${can && p[kind].length < MAX_PH ? `<label class="btn sm">+ 사진 추가<input type="file" accept="image/*" multiple hidden data-addph="${kind}"></label>` : ''}</div>
        <div class="phs">${p[kind].map((x) => `<div class="ph"><img src="${x.data}" alt="${label} 사진" data-zoom>${can && !x.seed ? `<button class="phx" data-delph="${kind}|${x.pid}" aria-label="사진 삭제">×</button>` : ''}</div>`).join('') || '<span class="small">없음</span>'}</div></div>`;
      el.innerHTML = `<div class="phwrap">${grp('before', '개선 전 (현재)', canEdit(it))}${grp('after', '개선 후', canAct(it))}</div>`;
      $$('[data-zoom]', el).forEach((im) => (im.onclick = () => lightbox(im.src)));
      $$('[data-addph]', el).forEach((inp) => (inp.onchange = async () => {
        const kind = inp.dataset.addph;
        try { const ds = await pickPhotos(inp.files, p[kind].length); for (const d of ds) await store.addPhoto(id, kind, d); await refreshThumbs(id); toast(`사진 ${ds.length}장을 올렸습니다`); drawPh(); } catch (e) { toast(e.message); }
      }));
      $$('[data-delph]', el).forEach((bt) => (bt.onclick = async () => {
        const [kind, pid] = bt.dataset.delph.split('|');
        const r = await askReason('사진 삭제', `${esc(itemTgt(it))}의 ${kind === 'after' ? '개선 후' : '개선 전'} 사진을 삭제합니다.`); if (!r) { openItem(id); return; }
        try { await store.deletePhoto(id, pid, r); await refreshThumbs(id); toast('사진을 삭제했습니다'); } catch (e) { toast(e.message); } openItem(id);
      }));
    }).catch(() => { const el = $('#ph'); if (el) el.innerHTML = ''; });
    drawPh();
    const on = (sel, fn) => { const b = $(sel); if (b) b.onclick = fn; };
    $$('[data-goacc]').forEach((l) => (l.onclick = (e) => { e.preventDefault(); const id = l.dataset.goacc; closeModal(); setView('acc'); setTimeout(() => openAcc(id), 30); }));
    $$('input[name="d-ctl"]').forEach((cb) => (cb.onchange = async () => {
      const v = $$('input[name="d-ctl"]').filter((c) => c.checked).map((c) => c.value);
      if (!v.length) { cb.checked = true; return toast('감소대책 유형은 하나 이상 골라야 합니다'); }
      try { await store.updateItem(id, { ctl: v }); $$('.cp', $('#d-ctl')).forEach((l) => { l.classList.remove('sug'); const e = l.querySelector('em'); if (e) e.remove(); }); $('#d-ctl-msg').textContent = '저장했습니다: ' + v.join(' · '); } catch (e) { toast(e.message); }
    }));
    const da = $('#d-also'); if (da) da.onchange = async () => { const also = new Set(it.also || []); da.checked ? also.add('정기') : also.delete('정기'); await store.updateItem(id, { also: [...also] }); toast(da.checked ? '정기 위험성평가에도 포함했습니다' : '정기 위험성평가에서 뺐습니다'); };
    if ($('#pp-d')) ppBind('d', () => it.pa || 0); else delete PP.d;
    on('#d-done', async () => {
      const dv = $('#d-date').value; const p = RA.parseMD(dv); if (!p) return toast('완료일을 입력하세요');
      try {
        const ds = (PP.d && PP.d.list) || []; for (const d of ds) await store.addPhoto(id, 'after', d);
        if (ds.length) await refreshThumbs(id);
        await store.updateItem(id, { status: 'done', doneDate: dv, doneM: p.m, doneY: p.y, doneNote: $('#d-note').value.trim(), exReason: '', doneBy: S.user.name });
        closeModal(); toast('개선 완료로 처리했습니다');
      } catch (e) { toast(e.message); }
    });
    on('#d-exbtn', async () => { const r = $('#d-ex').value.trim(); if (!r) return toast('제외 사유를 입력하세요'); await store.updateItem(id, { status: 'excluded', exReason: r, doneM: null, doneY: null, doneDate: '' }); closeModal(); toast('제외 처리했습니다'); });
    on('#d-reopen', async () => { await store.updateItem(id, { status: 'open', doneM: null, doneY: null, doneDate: '', exReason: '' }); closeModal(); toast('미결로 되돌렸습니다'); });
    on('#d-edit', () => { closeModal(); S.editId = id; setView('reg'); });
    on('#d-del', () => {
      askReason('평가 항목 삭제', `<b>${esc(itemTgt(it))}</b><br><span class="small">${esc(it.sit || '')}</span>`).then(async (r) => { if (!r) { openItem(id); return; } try { await store.deleteItems([id], r); toast('삭제했습니다 · 보관함에 30일 보관'); } catch (e) { toast('삭제하지 못했습니다: ' + e.message); } });
    });
  }

  // ---------- 감소대책 유형 일괄 분류 ----------
  function openCtlClassifier(src) {
    const pool = (src || yearItems()).filter((x) => x.kind !== 'nil' && x.kind !== 'meeting' && canEdit(x));
    if (!pool.length) return toast('분류할 수 있는 항목이 없습니다');
    const st = { only: pool.some((x) => !ctlOf(x).length), sel: {}, q: '' };
    pool.forEach((x) => (st.sel[x.id] = ctlOf(x).slice()));
    const changed = () => pool.filter((x) => st.sel[x.id].join() !== ctlOf(x).join() && st.sel[x.id].length);
    const rows = () => pool.filter((x) => (!st.only || !ctlOf(x).length) && (!st.q || RA.nz([x.place, x.act, x.sit, x.team].join(' ')).includes(RA.nz(st.q))));
    openModal(`<div class="modal-h"><div><h2>감소대책 유형 분류</h2><div class="small">각 행에서 해당하는 유형을 누르세요(여러 개 가능). 점선 테두리는 개선대책 문구로 짐작한 <b>추천</b>이고, 누르기 전에는 저장되지 않습니다.</div></div><button class="btn sm" data-close>닫기</button></div>
      <div class="ctl-legend">${RA.CTLS.map(([k, l, d], i) => `<span class="ctag c${i}">${esc(l)}</span><span class="small">${esc(d)}</span>`).join('')}</div>
      <div class="row" style="margin:10px 0">
        <span class="chips"><button class="chip" data-co="1">미지정만 <span class="n">${pool.filter((x) => !ctlOf(x).length).length}</span></button><button class="chip" data-co="0">전체 <span class="n">${pool.length}</span></button></span>
        <input type="search" id="cc-q" placeholder="장소·대책 검색" style="width:auto;flex:1;min-width:140px">
        <button class="btn sm" id="cc-sug" title="아직 아무것도 고르지 않은 행에 추천을 채워 넣습니다. 저장 전 확인하세요">보이는 미선택 행에 추천 채우기</button>
      </div>
      <div class="tw cc-wrap"><table class="items cc"><thead><tr><th>월 · 팀</th><th>장소 · 개선대책</th><th>감소대책 유형</th></tr></thead><tbody id="cc-body"></tbody></table></div>
      <div class="row" style="justify-content:space-between;margin-top:12px"><span class="small" id="cc-msg"></span><div class="row"><button class="btn ghost" data-close>취소</button><button class="btn pri" id="cc-save" disabled>저장</button></div></div>`);
    const box = $('#modal-box'); box.classList.add('wide');
    const draw = () => {
      $$('[data-co]', box).forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.co === +st.only)));
      const rs = rows();
      $('#cc-body').innerHTML = rs.slice(0, 400).map((x) => { const sg = st.sel[x.id].length ? '' : RA.suggestCtl(x.act);
        return `<tr data-cc="${x.id}"><td class="num" style="white-space:nowrap">${x.m}월<div class="small">${esc(x.team)}</div></td><td><b>${esc(x.place)}</b><div class="clip">${esc(x.act) || '<span class="small">개선대책 없음</span>'}</div><div class="small clip">${esc(x.sit)}</div></td>
        <td><div class="cc-btns">${RA.CTLS.map(([k], i) => `<button type="button" class="cbtn c${i} ${sg === k ? 'sug' : ''}" data-k="${k}" aria-pressed="${st.sel[x.id].includes(k)}">${ctlNo(k)} ${k}</button>`).join('')}</div></td></tr>`; }).join('') || '<tr><td colspan="3" class="small">해당 항목이 없습니다.</td></tr>';
      if (rs.length > 400) $('#cc-body').insertAdjacentHTML('beforeend', `<tr><td colspan="3" class="small">400건까지 표시합니다. 검색으로 좁혀 주세요.</td></tr>`);
      const n = changed().length; $('#cc-save').disabled = !n; $('#cc-save').textContent = n ? `${n}건 저장` : '저장';
      $('#cc-msg').textContent = `표시 ${rs.length}건 · 미지정 ${pool.filter((x) => !st.sel[x.id].length).length}건 남음`;
    };
    box.onclick = (e) => {
      const b = e.target.closest('.cbtn'); if (b) { const id = b.closest('tr').dataset.cc, k = b.dataset.k, a = st.sel[id]; st.sel[id] = a.includes(k) ? a.filter((v) => v !== k) : CTL_KEYS.filter((v) => v === k || a.includes(v)); draw(); return; }
      const c = e.target.closest('[data-co]'); if (c) { st.only = c.dataset.co === '1'; draw(); }
    };
    $('#cc-q').oninput = (e) => { st.q = e.target.value; draw(); };
    $('#cc-sug').onclick = () => { let k = 0; rows().forEach((x) => { if (!st.sel[x.id].length) { const sg = RA.suggestCtl(x.act); if (sg) { st.sel[x.id] = [sg]; k++; } } }); draw(); toast(k ? `${k}건에 추천을 채웠습니다. 확인 후 저장하세요` : '채울 추천이 없습니다'); };
    $('#cc-save').onclick = async () => {
      const tg = changed(); const b = $('#cc-save'); b.disabled = true; let k = 0;
      try { for (const x of tg) { b.textContent = `${++k}/${tg.length}…`; await store.updateItem(x.id, { ctl: st.sel[x.id] }); } closeModal(); toast(`${tg.length}건의 감소대책 유형을 저장했습니다`); }
      catch (e) { toast('저장하지 못했습니다: ' + e.message); b.disabled = false; }
    };
    draw();
  }

  // ---------- 평가 등록 ----------
  function myZones() { return isAdmin() ? RA.ZONES : RA.ZONES.filter((z) => z.team === S.user.team); }
  function catOptions(v) {
    let found = false;
    const opts = RA.CATEGORIES.map(([g, subs]) => `<optgroup label="${esc(g)}">${subs.map((s) => { const sel = v && RA.nz(s) === RA.nz(v); if (sel) found = true; return `<option ${sel ? 'selected' : ''}>${esc(s)}</option>`; }).join('')}</optgroup>`).join('');
    return `<option value="">선택</option>${v && !found ? `<option selected>${esc(v)}</option>` : ''}${opts}`;
  }
  const numOpts = (v, n = 5) => `<option value=""></option>` + Array.from({ length: n }, (_, i) => `<option ${v === i + 1 ? 'selected' : ''}>${i + 1}</option>`).join('');
  function renderReg() {

    const scaleOpts = (list, v) => `<option value=""></option>` + list.map((x) => `<option value="${x.v}" ${+v === x.v ? 'selected' : ''} title="${esc(x.desc)}">${x.v} · ${esc(x.name)}${x.label ? ` (${esc(x.label)})` : ''}</option>`).join('');
    const zones = myZones();
    const places = [...new Set(realItems().filter((x) => !isSup() || x.team === S.user.team).map((x) => x.place).filter(Boolean))].slice(0, 200);
    const owners = [...new Set(realItems().map((x) => x.owner).filter(Boolean))];
    const hazList = ['넘어짐', '끼임', '추락', '감전', '화재 / 폭발위험', '충돌', '낙하', '베임', '화상', '근골격계 질환', '질식', '화학물질 노출', '방사선'];
    const M = it.m || S.regMonth;
    const team = isAdmin() ? null : S.user.team;
    const monthItems = S.items.filter((x) => x.m === M && itemYear(x) === S.Y && (!team || x.team === team));
    v.innerHTML = `
      <div class="pagehead"><div><h1>${edit ? '평가 항목 수정' : '평가 등록'}</h1><p>${isAdmin() ? '관리자는 모든 팀 구역에 등록할 수 있습니다' : `${esc(S.user.team)} 담당 구역 ${zones.length}곳`} · 엑셀 평가표와 같은 항목입니다</p></div></div>
      <div class="grid2">
        <form class="card" id="reg-form" autocomplete="off">${AL ? `<div class="notice info" style="margin-bottom:12px">안전사고 <b>${esc(AL.note)}</b> (${esc(AL.date)})의 수시 위험성평가로 연결해 저장합니다. 원인별로 여러 항목을 연달아 등록할 수 있습니다. <button type="button" class="btn sm ghost" id="r-acc-x">연결 해제</button></div>` : edit && edit.accId ? `<div class="notice info" style="margin-bottom:12px">연결된 안전사고: ${esc((S.acc.find((a) => a.id === edit.accId) || {}).desc || edit.accId)}</div>` : ''}
          <div class="fgrid">
            <label class="f">평가 종류<select id="r-type">${RA.TYPES.map((t) => `<option ${typeOf(it) === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
            <label class="f s2 rtn" style="align-self:end"><span><input type="checkbox" id="r-also" ${typeIs(it, '정기') && typeOf(it) === '상시' ? 'checked' : ''}> 정기 위험성평가(본사) 결과에도 포함</span></label>
            <label class="f s2 occ">실시 사유 <span class="hint">수시 위험성평가</span><select id="r-trig"><option value="">선택</option>${RA.TRIGGERS.map((t) => `<option ${it.trigger === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
            <label class="f occ">사고·변경일<input type="date" id="r-acc" value="${esc(it.accDate || '')}"></label>
            <label class="f s4 occ">사고·변경 내용<input type="text" id="r-accn" value="${esc(it.accNote || '')}" placeholder="예: 10/14 양념공정 지게차 충돌 아차사고"></label>
            <label class="f">평가월<select id="r-m">${Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}" ${M === i + 1 ? 'selected' : ''}>${i + 1}월</option>`).join('')}</select></label>
            <label class="f s2">구역<select id="r-zone">${zones.map((z) => `<option value="${z.id}" ${it.zone === z.id ? 'selected' : ''}>${esc(z.team)} · ${esc(z.name)}</option>`).join('')}${edit && !it.zone ? '<option value="" selected>구역 미지정</option>' : ''}</select></label>
            <label class="f">장소<input type="text" id="r-place" list="dl-place" value="${esc(it.place)}" placeholder="예: 수포장 외포장" required></label>
            <label class="f s2">분류<select id="r-cat">${catOptions(it.cat)}</select></label>
            <label class="f s2">위험요인<input type="text" id="r-haz" list="dl-haz" value="${esc(it.haz)}" placeholder="예: 넘어짐" required></label>
            <label class="f s4">위험발생 상황 및 결과<textarea id="r-sit" required placeholder="무엇이 어떤 상태라서 어떤 사고가 날 수 있는지">${esc(it.sit)}</textarea></label>

            <label class="f s4">개선대책<textarea id="r-act" required placeholder="예: 유도등 보수">${esc(it.act)}</textarea></label>

            <div class="f s2" style="display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--ink-2)">개선후 위험성<div class="riskbox" id="r-r2"></div></div>
            <label class="f s2">담당팀 <span class="hint">개선 조치를 맡는 팀</span><select id="r-dept"><option value="">선택</option>${RA.TEAMS.map((t) => `<option ${it.dept === t ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
            <label class="f">조치요구일<input type="date" id="r-due" value="${esc(RA.toISO(RA.parseMD(it.due)))}"></label>
            ${ppHTML('r', '현재 사진 (개선 전)')}
          </div>
          <datalist id="dl-place">${places.map((p) => `<option value="${esc(p)}">`).join('')}</datalist>
          <datalist id="dl-haz">${hazList.map((p) => `<option value="${esc(p)}">`).join('')}</datalist>
          <div class="row" style="margin-top:14px;justify-content:flex-end">
            ${edit ? '<button type="button" class="btn ghost" id="r-cancel">수정 취소</button>' : ''}
            <button type="submit" class="btn pri" id="r-save">${edit ? '수정 저장' : '등록'}</button>
          </div>
        </form>
        <div class="card"><div class="card-h"><h2>${M}월 구역별 입력 현황</h2><span class="sub">항목이 없으면 '이상없음'으로 제출</span></div>
          <div class="zone-list">${zones.map((z) => { const n = S.items.filter((x) => x.zone === z.id && x.m === M && x.kind !== 'nil' && isRoutine(x) && itemYear(x) === S.Y).length; const nil = S.items.find((x) => x.zone === z.id && x.m === M && x.kind === 'nil' && itemYear(x) === S.Y);
            return `<div class="zone-it"><div><div class="nm">${esc(z.name)}</div><div class="small">${esc(z.team)}</div></div><div class="row">${n ? `<span class="pill p-done num">${n}건 입력</span>` : nil ? `<span class="pill p-lo">✓ 이상없음</span><button class="btn sm ghost" data-unnil="${nil.id}">취소</button>` : `<span class="pill p-open">미입력</span><button class="btn sm" data-nil="${z.id}">이상없음 제출</button>`}</div></div>`; }).join('')}</div>

      <div class="card"><div class="card-h"><h2>${M}월 등록 항목${team ? ` · ${esc(team)}` : ''}</h2><span class="sub">행을 누르면 상세·수정</span></div>${itemsTable(monthItems.filter((x) => x.kind !== 'nil'))}</div>`;
    const upd = () => {
      const r = (a, b) => { const f = +$(a).value, s = +$(b).value; return f && s ? f * s : null; };

      const gtxt = (r) => { const g = RA.grade(r); return g ? `<span class="small">${esc(g.allow)}</span>` : ''; };

  async function uploadBundle(files) {
    const msg = $('#bundle-msg'), say = (t) => { if (msg) msg.textContent = t; };
    let nItem = 0, nPh = 0, skip = 0, noMatchAll = 0;
    for (const f of files) {
      say(`${f.name} 읽는 중…`);
      let data; try { data = JSON.parse(await f.text()); } catch (e) { toast(`${f.name}: 사진 묶음 파일이 아닙니다`); continue; }
      const entries = Object.entries((data && data.items) || {});
      // 행 번호(sn)가 없는 항목(이전 버전으로 올린 취합본)은 월·팀·장소·내용으로 짝을 찾음
      const key = (x) => [x.m, x.team, RA.nz(x.place), RA.nz(x.sit), RA.nz(x.act)].join('|');
      const snByKey = {}; (window.SEED || []).forEach((r) => (snByKey[key(r)] = snByKey[key(r)] || []).push(String(r.sn)));
      const pool = S.items.filter((x) => x.src === '취합본' && x.kind !== 'nil').sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
      const bySn = {}; const used = {};
      pool.forEach((x) => { let sn = x.sn != null ? String(x.sn) : null; if (!sn) { const q = snByKey[key(x)] || [], k = key(x); used[k] = used[k] || 0; sn = q[used[k]++] || null; } if (sn && !bySn[sn]) bySn[sn] = x; });
      let noMatch = 0;
      for (let i = 0; i < entries.length; i++) {
        const [sn, v] = entries[i];
        const it = bySn[String(sn)]; if (!it) { noMatch++; continue; }
        if (it.sn == null) { try { await store.updateItem(it.id, { sn: +sn }); } catch (e) { /* 다음에 다시 짝을 찾음 */ } }
        if (it.pb || it.pa) { skip++; continue; }
        say(`${f.name} · ${i + 1}/${entries.length}건 올리는 중…`);

      }

  }

        <div class="row" style="justify-content:flex-end" id="rs-r1"><button class="btn ghost" data-close>취소</button><button class="btn danger" id="rs-go">삭제</button></div>
        <div class="rs-confirm" id="rs-r2" hidden><b>정말 삭제하시겠습니까?</b><span class="small">사유: <span id="rs-echo"></span></span><div class="row" style="justify-content:flex-end"><button class="btn ghost" id="rs-no">아니요</button><button class="btn danger" id="rs-yes">예, 삭제합니다</button></div></div>`);
      const go = () => { const v = $('#rs-in').value.trim(); if (v.length < 2) { toast('삭제 사유를 입력하세요'); $('#rs-in').focus(); return; } $('#rs-echo').textContent = v; $('#rs-r1').hidden = true; $('#rs-r2').hidden = false; $('#rs-in').disabled = true; $('#rs-yes').focus(); };
      $('#rs-no').onclick = () => { $('#rs-r1').hidden = false; $('#rs-r2').hidden = true; $('#rs-in').disabled = false; $('#rs-in').focus(); };
      $('#rs-yes').onclick = () => { fin($('#rs-in').value.trim()); closeModal(); };
      $('#rs-go').onclick = go; $('#rs-in').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } }; setTimeout(() => { const i = $('#rs-in'); if (i) i.focus(); }, 30);
      const t = setInterval(() => { if ($('#modal').hidden || !$('#rs-in')) { clearInterval(t); fin(null); } }, 150);
    });
  }
  // 관리 · 취합 화면의 변경이력 · 보관함
  S.logs = []; S.trash = []; S.lgq = ''; S.lga = '';
  function auditCards() {
    const now = Date.now(), live = S.trash.filter((t) => now - t.at < TRASH_DAYS * 864e5).sort((a, b) => b.at - a.at), old = S.trash.length - live.length;
    const acts = [...new Set(S.logs.map((l) => l.act))].sort(), q = RA.nz(S.lgq);
    const L = S.logs.filter((l) => (!S.lga || l.act === S.lga) && (!q || RA.nz([l.by, l.team, l.act, l.tgt, l.msg].join(' ')).includes(q))).slice(0, 500);
    const dt = (t) => { const d = new Date(t); return `${RA.toISO({ y: d.getFullYear(), m: d.getMonth() + 1, d: d.getDate() })} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
    const kindL = { item: '평가 항목', acc: '안전사고', photo: '사진' };
    return `<div class="card" id="trash-card"><div class="card-h"><h2>삭제 보관함 · ${live.length}건</h2><span class="sub">삭제 후 ${TRASH_DAYS}일 보관 · 관리자만 되살리기</span></div>
        ${live.length ? `<div class="tw"><table class="items"><thead><tr><th>삭제 일시</th><th>삭제자</th><th>종류</th><th>대상</th><th>사유</th><th>남은 기간</th><th></th></tr></thead><tbody>${live.map((t) => `<tr><td class="num" style="white-space:nowrap">${dt(t.at)}</td><td>${esc(t.by)}</td><td><span class="pill p-open">${kindL[t.kind] || t.kind}</span></td><td>${esc(t.label || '')}</td><td>${esc(t.reason || '')}</td><td class="num">${Math.max(0, TRASH_DAYS - Math.floor((now - t.at) / 864e5))}일</td><td style="white-space:nowrap"><button class="btn sm" data-tview="${t.id}">보기</button> <button class="btn sm pri" data-trest="${t.id}">되살리기</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="small">최근 삭제한 항목이 없습니다.</p>'}
        ${old ? `<div class="row" style="margin-top:8px"><span class="small">${TRASH_DAYS}일이 지난 보관 항목 ${old}건</span><button class="btn sm ghost" id="trash-purge">완전히 비우기</button></div>` : ''}</div>
      <div class="card" id="log-card"><div class="card-h"><h2>변경이력</h2><span class="sub">누가 · 언제 · 무엇을 · 최근 ${S.logs.length}건 · 기록은 수정·삭제할 수 없습니다</span></div>
        <div class="filters" style="margin-bottom:10px"><select id="lg-a"><option value="">작업 전체</option>${acts.map((a) => `<option ${S.lga === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select><input type="search" id="lg-q" placeholder="이름·팀·대상·내용 검색" value="${esc(S.lgq)}"><button class="btn sm" id="lg-xls">엑셀로 받기</button></div>
        <div class="tw" style="max-height:520px;overflow:auto"><table class="items"><thead><tr><th>일시</th><th>누가</th><th>작업</th><th>대상</th><th>내용</th></tr></thead><tbody>${L.map((l) => `<tr><td class="num" style="white-space:nowrap">${dt(l.at)}</td><td style="white-space:nowrap">${esc(l.by)}<div class="small">${esc(l.team || '')}</div></td><td style="white-space:nowrap"><span class="pill ${/삭제|취소/.test(l.act) ? 'p-hi' : /되살|복원/.test(l.act) ? 'p-done' : 'p-open'}">${esc(l.act)}</span></td><td>${esc(l.tgt)}</td><td class="small">${esc(l.msg)}</td></tr>`).join('') || '<tr><td colspan="5" class="small">기록이 없습니다. 이 기능을 넣은 뒤부터 쌓입니다.</td></tr>'}</tbody></table></div></div>`;
  }
  function bindAudit(v) {
    const ref = () => { const y = window.scrollY; renderAdmin(); window.scrollTo(0, y); };
    const a = $('#lg-a'); if (a) a.onchange = (e) => { S.lga = e.target.value; ref(); };
    let qt; const q = $('#lg-q'); if (q) q.oninput = (e) => { clearTimeout(qt); qt = setTimeout(() => { S.lgq = e.target.value; ref(); const i = $('#lg-q'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 300); };
    const xl = $('#lg-xls'); if (xl) xl.onclick = async () => { let X; try { X = await needXLSX(); } catch (e) { return toast(e.message); } const ws = X.utils.json_to_sheet(S.logs.map((l) => ({ 일시: new Date(l.at).toLocaleString('ko-KR'), 이름: l.by, 팀: l.team, 작업: l.act, 대상: l.tgt, 내용: l.msg }))); ws['!cols'] = [20, 8, 8, 16, 40, 60].map((w) => ({ wch: w })); const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, '변경이력'); X.writeFile(wb, `위험성평가_변경이력_${RA.toISO({ y: TODAY.getFullYear(), m: TODAY.getMonth() + 1, d: TODAY.getDate() })}.xlsx`); };
    $$('[data-tview]', v).forEach((b) => (b.onclick = () => { const t = S.trash.find((x) => x.id === b.dataset.tview); if (!t) return; const d = t.data || {};
      openModal(`<div class="modal-h"><h2>보관 내용</h2><button class="btn sm" data-close>닫기</button></div><p class="small" style="margin:0">${esc(t.by)} · 사유: ${esc(t.reason)}</p>${t.kind === 'photo' ? `<img src="${d.data}" alt="삭제된 사진" style="max-width:100%;border-radius:8px">` : `<dl class="kv">${Object.entries(d).filter(([k, x]) => x !== '' && x != null && !['tb', 'ta', 'createdAt', 'updatedAt', 'createdBy', 'updatedBy'].includes(k) && typeof x !== 'object').map(([k, x]) => `<dt>${esc(FLD[k] || k)}</dt><dd>${esc(fv(k, x))}</dd>`).join('')}</dl>`}`); }));
    $$('[data-trest]', v).forEach((b) => (b.onclick = async () => { const t = S.trash.find((x) => x.id === b.dataset.trest); if (!t) return; if (!confirm(`'${t.label}'을(를) 되살리시겠습니까?`)) return;
      b.disabled = true; try { await store.restoreTrash(t); if (t.kind === 'photo') await refreshThumbs(t.ref); logAct('되살리기', t.label, `삭제 사유였던: ${t.reason}`); toast('되살렸습니다'); } catch (e) { toast('되살리지 못했습니다: ' + e.message); b.disabled = false; } }));
    const pg = $('#trash-purge'); if (pg) pg.onclick = async () => { if (!confirm('보관 기간이 지난 항목을 완전히 삭제하시겠습니까? 되살릴 수 없습니다.')) return; const old = S.trash.filter((t) => Date.now() - t.at >= TRASH_DAYS * 864e5); await store.purgeTrash(old.map((t) => t.id)); logAct('보관함 비우기', `${old.length}건`, `${TRASH_DAYS}일 경과분`); toast('비웠습니다'); };
  }

  // ---------- 로그인 ----------
  async function renderLogin() {
    const b = $('#login-body');
    if (!LIVE) {
      b.innerHTML = `<div class="notice info">데모 모드입니다. 계정을 골라 권한별 화면을 확인하세요. 실제 운영에서는 사번과 비밀번호로 로그인합니다.</div>
        <div class="demo-users">${DEMO_USERS.map((u) => `<button data-u="${u.uid}"><span><b>${esc(u.name)}</b> <span class="small">${esc(u.team)}</span></span><span class="small">${ROLE_LABEL[u.role]}</span></button>`).join('')}</div>`;
      $$('[data-u]', b).forEach((x) => (x.onclick = () => store.loginDemo(x.dataset.u)));
      return;
    }
    b.innerHTML = `<form id="lf" class="fgrid" style="grid-template-columns:1fr">
      <label class="f">사번<input type="text" id="l-emp" autocomplete="username" required></label>
      <label class="f">비밀번호<input type="password" id="l-pw" autocomplete="current-password" required></label>
      <button class="btn pri" type="submit">로그인</button><p class="small" id="l-msg" style="margin:0"></p></form><div id="boot"></div>`;
    $('#lf').onsubmit = async (e) => { e.preventDefault(); $('#l-msg').textContent = '확인 중…'; try { await store.login($('#l-emp').value, $('#l-pw').value); } catch (err) { $('#l-msg').textContent = '사번 또는 비밀번호가 맞지 않습니다'; } };
    if (await store.needsBootstrap()) {
      $('#boot').innerHTML = `<details><summary class="small" style="cursor:pointer">처음 설치: 관리자(SHE) 계정 만들기</summary><form id="bf" class="fgrid" style="grid-template-columns:1fr;margin-top:10px">
        <label class="f">사번<input type="text" id="b-emp" required></label><label class="f">이름<input type="text" id="b-name" required></label>
        <label class="f">비밀번호(6자 이상)<input type="password" id="b-pw" minlength="6" required></label><button class="btn" type="submit">관리자 계정 만들기</button></form></details>`;
      $('#bf').onsubmit = async (e) => { e.preventDefault(); try { await store.bootstrap($('#b-emp').value.trim(), $('#b-name').value.trim(), $('#b-pw').value); } catch (err) { toast('만들지 못했습니다: ' + err.message); } };
    }
  }
  $('#btn-logout').onclick = () => store.logout();
  $('#btn-pw').onclick = () => {
    openModal(`<div class="modal-h"><h2>비밀번호 변경</h2><button class="btn sm" data-close>닫기</button></div><form id="pwf" class="fgrid" style="grid-template-columns:1fr"><label class="f">새 비밀번호(6자 이상)<input type="password" id="pw1" minlength="6" required autocomplete="new-password"></label><button class="btn pri">변경</button></form>`);
    $('#pwf').onsubmit = async (e) => { e.preventDefault(); try { await store.changePassword($('#pw1').value); closeModal(); toast('비밀번호를 바꿨습니다'); } catch (err) { toast(err.code === 'auth/requires-recent-login' ? '다시 로그인한 뒤 변경해 주세요' : err.message); } };
  };

  // ---------- 시작 ----------
  let unsubItems = null, unsubUsers = null, unsubReg = null, unsubImg = null, unsubAcc = null, unsubKpi = null, unsubLogs = null, unsubTrash = null;
  async function start() {
    $('#mode').textContent = LIVE ? '실시간' : '데모'; $('#mode').classList.toggle('live', LIVE);
    try { await store.init(); } catch (e) { $('#login-body').innerHTML = `<div class="notice">서버에 연결하지 못했습니다. 인터넷 연결과 Firebase 설정을 확인하세요.<br><span class="small">${esc(e.message)}</span></div>`; return; }
    store.onAuth((u) => {
      S.user = u;
      if (unsubItems) { unsubItems(); unsubItems = null; } if (unsubUsers) { unsubUsers(); unsubUsers = null; }
      if (!u) { $('#login').hidden = false; $('#top').hidden = true; $('#app').hidden = true; renderLogin(); return; }
      $('#login').hidden = true; $('#top').hidden = false; $('#app').hidden = false;
      $('#u-name').textContent = u.name; $('#u-av').textContent = String(u.name || '?').replace(/\s/g, '').slice(-2); $('#u-role').textContent = `${u.team ? u.team + ' · ' : ''}${ROLE_LABEL[u.role] || ''}`;
      $('#tab-admin').hidden = !isAdmin(); $('#btn-pw').hidden = !LIVE;
      setYear(CUR_Y);
      unsubItems = store.subscribeItems((items) => { S.items = items; renderYearSel(); if (S.view === 'reg' && S.regDirty) return; render(); });
      if (unsubReg) unsubReg(); if (unsubImg) unsubImg();
      unsubReg = store.subscribeReg((doc) => { S.reg = doc && doc.sections ? doc : null; RA.setCriteria(REG()); if (!(S.view === 'reg' && S.regDirty) && $('#modal').hidden) render(); });
      unsubImg = store.subscribeRegImgs((m) => { S.regImgs = m || {}; if (S.view === 'rule' && $('#modal').hidden) render(); });
      if (unsubLogs) { unsubLogs(); unsubLogs = null; } if (unsubTrash) { unsubTrash(); unsubTrash = null; }
      if (u.role === 'admin') { unsubLogs = store.subscribeLogs((L) => { S.logs = L || []; if (S.view === 'admin' && $('#modal').hidden && !(document.activeElement && document.activeElement.id === 'lg-q')) { const y = window.scrollY; render(); window.scrollTo(0, y); } }); unsubTrash = store.subscribeTrash((T) => { S.trash = T || []; if (S.view === 'admin' && $('#modal').hidden) { const y = window.scrollY; render(); window.scrollTo(0, y); } }); }
      if (unsubKpi) unsubKpi(); unsubKpi = store.subscribeKpi((d) => { S.kpi = d && d.years ? d : null; if (S.view === 'acc' && S.accTab === 'kpi' && $('#modal').hidden && !Object.keys(KDIRTY).length) render(); });
      if (unsubAcc) unsubAcc(); unsubAcc = store.subscribeAcc((L) => { S.acc = L || []; if ((S.view === 'acc' || S.view === 'dash') && $('#modal').hidden) render(); });
      unsubUsers = store.subscribeUsers((us) => { S.users = us; if (S.view === 'admin') render(); });
      setView(S.view);
    });
  }
  start();
})();

</style><script>
(function(){
var DSW_CUR="risk",BRAND="#brand-home",LOGIN="#l-emp";
var L=[["risk","risk.html","⚠️","위험성평가","상시·정기·수시 · 안전사고 · 재해지수"],
       ["fire","fire.html","🧯","소방시설","도면 · 소화기 점검 · 자위소방대"],
       ["iso","iso.html","📋","ISO 45001 법규","법규 의무 · 이행 현황"]];
function mk(){
  if(document.getElementById("dswBtn"))return true;
  var b=document.querySelector(BRAND);if(!b)return false;
  var btn=document.createElement("button");btn.type="button";btn.id="dswBtn";btn.className="dsw-btn";btn.title="다른 대시보드로 이동";
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="dsw-l">대시보드</span>';
  var m=document.createElement("div");m.className="dsw-menu";m.id="dswMenu";m.hidden=true;
  m.innerHTML='<div class="dsw-h">다른 대시보드로 이동 · 처음 한 번만 로그인</div>'+L.map(function(x){return '<a href="'+x[1]+'"'+(x[0]===DSW_CUR?' class="cur"':'')+'><i>'+x[2]+'</i><div><b>'+x[3]+(x[0]===DSW_CUR?' (지금 화면)':'')+'</b><span>'+x[4]+'</span></div></a>'}).join("");
  document.body.appendChild(m);
  b.insertAdjacentElement("afterend",btn);
  btn.addEventListener("click",function(e){e.stopPropagation();
    if(!m.hidden){m.hidden=true;return}
    var r=btn.getBoundingClientRect();m.hidden=false;
    var w=m.offsetWidth,x=Math.min(r.left,innerWidth-w-8);m.style.left=Math.max(8,x)+"px";m.style.top=(r.bottom+6)+"px"});
  document.addEventListener("click",function(e){if(!m.hidden&&!m.contains(e.target))m.hidden=true});
  addEventListener("keydown",function(e){if(e.key==="Escape")m.hidden=true});
  addEventListener("resize",function(){m.hidden=true});
  return true}
/* 사번 기억: 한 대시보드에서 로그인하면 다른 대시보드 로그인 칸에 미리 채움 */
function fill(){var i=document.querySelector(LOGIN);if(i&&!i.value&&!i.dataset.dswf){var v="";try{v=localStorage.getItem("hs_emp")||""}catch(e){}if(v){i.value=v;i.dataset.dswf="1";i.dispatchEvent(new Event("input",{bubbles:true}))}}}
document.addEventListener("submit",function(e){var i=e.target&&e.target.querySelector&&e.target.querySelector(LOGIN);if(i&&i.value.trim()){try{localStorage.setItem("hs_emp",i.value.trim())}catch(x){}}},true);
document.addEventListener("click",function(e){var bt=e.target.closest&&e.target.closest("button");if(!bt)return;var i=document.querySelector(LOGIN);if(i&&i.value.trim()&&(bt.type==="submit"||(bt.form&&bt.form.contains(i)))){try{localStorage.setItem("hs_emp",i.value.trim())}catch(x){}}},true);
function tick(){mk();fill()}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",tick);else tick();
new MutationObserver(tick).observe(document.documentElement,{childList:true,subtree:true});
})();
</script></body></html>
