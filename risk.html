<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>상시위험성평가 대시보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>/* Layout: 고정 상단 바 + 탭 뷰. 대시보드는 '요약 → 팀 → 구역 → 원인 → 조치' 순서로 내려 읽는다. */
:root {
  --bg: #eef0ec;
  --surface: #ffffff;
  --surface-2: #f6f7f4;
  --ink: #16201b;
  --ink-2: #47524c;
  --muted: #76817b;
  --line: #dde2dc;
  --line-2: #c9d0c9;
  --accent: #0d6a4e;          /* 안전녹색 */
  --accent-soft: #e2f0ea;
  --accent-ink: #ffffff;
  --s1: #2a78d6;              /* 발굴 */
  --s2: #1baf7a;              /* 개선 */
  --s3: #eb6834;              /* 미완료 */
  --g3-bg: #fbf3d0; --g3-fg: #7a6200;
  --hi: #c8372d; --hi-soft: #fbe6e3;
  --mid: #b87500; --mid-soft: #fbf0d9;
  --lo: #3b7d58; --lo-soft: #e3f1e8;
  --ex: #1f86bd; --ex-soft: #ddeff8;
  --done-mark: #f4d000;
  --seq-0: #f1f5fb; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec; --seq-4: #3987e5; --seq-5: #256abf;
  --shadow: 0 1px 2px rgba(20, 35, 28, .06), 0 4px 14px rgba(20, 35, 28, .05);
  --f-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #182019; --surface-2: #1d2621; --ink: #e7ece8; --ink-2: #b9c3bd; --muted: #8b968f;
    --line: #2a352f; --line-2: #39463f; --accent: #3fb68b; --accent-soft: #173328; --accent-ink: #08130e;
    --s1: #3987e5; --s2: #199e70; --s3: #d95926; --g3-bg: #352f12; --g3-fg: #e9cf5a; --s3: #d95926; --g3-bg: #352f12; --g3-fg: #e9cf5a;
    --hi: #ff7a6e; --hi-soft: #3a1d1a; --mid: #f0b44a; --mid-soft: #362a12; --lo: #6fcf97; --lo-soft: #16301f; --ex: #5bb8ea; --ex-soft: #13293a;
    --done-mark: #d6b800;
    --seq-0: #1b2430; --seq-1: #1c3a5e; --seq-2: #1c5cab; --seq-3: #2a78d6; --seq-4: #5598e7; --seq-5: #9ec5f4;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #182019; --surface-2: #1d2621; --ink: #e7ece8; --ink-2: #b9c3bd; --muted: #8b968f;
  --line: #2a352f; --line-2: #39463f; --accent: #3fb68b; --accent-soft: #173328; --accent-ink: #08130e;
  --s1: #3987e5; --s2: #199e70; --s3: #d95926; --g3-bg: #352f12; --g3-fg: #e9cf5a;
  --hi: #ff7a6e; --hi-soft: #3a1d1a; --mid: #f0b44a; --mid-soft: #362a12; --lo: #6fcf97; --lo-soft: #16301f; --ex: #5bb8ea; --ex-soft: #13293a;
  --done-mark: #d6b800;
  --seq-0: #1b2430; --seq-1: #1c3a5e; --seq-2: #1c5cab; --seq-3: #2a78d6; --seq-4: #5598e7; --seq-5: #9ec5f4;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1320px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.brand-t { font-weight: 700; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.brand-s { font-size: 12px; color: var(--muted); white-space: nowrap; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tab { border: 0; background: none; padding: 7px 12px; border-radius: 7px; color: var(--ink-2); cursor: pointer; font-weight: 500; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mode { font-size: 11px; font-weight: 700; letter-spacing: .04em; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--muted); }
.mode.live { color: var(--accent); border-color: var(--accent); }
.user { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.user b { font-weight: 600; }
.role { font-size: 11px; color: var(--muted); }

main { max-width: 1320px; margin: 0 auto; padding-block: 20px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.view[hidden] { display: none !important; }
.view { display: grid; gap: 16px; min-width: 0; }

.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pagehead h1 { font-size: 22px; letter-spacing: -.02em; }
.pagehead p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.card-h h2 { font-size: 15px; letter-spacing: -.01em; }
.card-h .sub { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; }
.grid2b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 960px) { .grid2, .grid2b { grid-template-columns: minmax(0, 1fr); } }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; }
.kpi-l { font-size: 12px; color: var(--ink-2); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.kpi-v { font-family: var(--f-num); font-size: 26px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.kpi-v small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.kpi-s { font-size: 12px; color: var(--muted); }
.kpi.alert { border-color: color-mix(in srgb, var(--hi) 45%, var(--line)); }
.kpi.alert .kpi-v { color: var(--hi); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--s2); border-radius: 3px; }

/* tables */
.tw { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; font-weight: 600; color: var(--ink-2); background: var(--surface-2); white-space: nowrap; }
td.r, th.r { text-align: right; }
td.c, th.c { text-align: center; }
tr.tot td { font-weight: 700; background: var(--surface-2); }
.t-team td { font-variant-numeric: tabular-nums; } .t-team td:first-child { white-space: nowrap; }
.items td { font-size: 13px; }
.items tr.clickable { cursor: pointer; }
.items tr.clickable:hover td { background: var(--surface-2); }
.clip { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.small { font-size: 12px; color: var(--muted); }

/* pills */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.5; }
.p-hi { background: var(--hi-soft); color: var(--hi); }
.p-mid { background: var(--mid-soft); color: var(--mid); }
.p-lo { background: var(--lo-soft); color: var(--lo); }
.p-ex { background: var(--ex-soft); color: var(--ex); }
.p-open { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line-2); }
.p-done { background: var(--lo-soft); color: var(--lo); }
.p-src { background: var(--surface-2); color: var(--muted); font-weight: 500; }

/* buttons & forms */
.btn { border: 1px solid var(--line-2); background: var(--surface); padding: 7px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.danger { color: var(--hi); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip .n { font-family: var(--f-num); font-size: 11.5px; opacity: .75; }
label.f { display: grid; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); min-width: 0; }
label.f .hint { font-weight: 400; color: var(--muted); font-size: 11.5px; }
input[type="text"], input[type="password"], input[type="date"], input[type="search"], select, textarea {
  border: 1px solid var(--line-2); background: var(--surface); border-radius: 7px; padding: 7px 9px; width: 100%; min-width: 0; font-size: 13.5px; }
textarea { resize: vertical; min-height: 64px; }
.fgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.fgrid .s2 { grid-column: span 2; } .fgrid .s4 { grid-column: 1 / -1; }
@media (max-width: 720px) { .fgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .fgrid .s2 { grid-column: 1 / -1; } }
.riskbox { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; background: var(--surface-2); border: 1px dashed var(--line-2); min-height: 36px; }
.riskbox .num { font-size: 18px; font-weight: 600; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters select, .filters input { width: auto; min-width: 110px; }
.filters input[type="search"] { min-width: 180px; flex: 1; }

/* matrix */
.mx td, .mx th { padding: 5px 4px; text-align: center; border-bottom: 1px solid var(--line); }
.mx th:first-child, .mx td:first-child { text-align: left; padding-left: 8px; white-space: nowrap; }
.mx .tm td { background: var(--surface-2); font-weight: 700; }
.mx .cell { display: grid; place-items: center; height: 26px; min-width: 30px; border-radius: 5px; font-family: var(--f-num); font-size: 12px; }
.mx .c0 { background: var(--seq-0); } .mx .c1 { background: var(--seq-1); } .mx .c2 { background: var(--seq-2); }
.mx .c3 { background: var(--seq-3); color: #fff; } .mx .c4 { background: var(--seq-4); color: #fff; } .mx .c5 { background: var(--seq-5); color: #fff; }
.mx .miss { background: transparent; border: 1.5px dashed var(--hi); color: var(--hi); font-family: var(--f-body); font-size: 10.5px; font-weight: 700; }
.mx .nil { background: var(--lo-soft); color: var(--lo); font-size: 11px; font-family: var(--f-body); font-weight: 700; }
.mx .fut { color: var(--line-2); }
.mx .now { outline: 2px solid var(--ink); outline-offset: -2px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.hbar { display: grid; grid-template-columns: 92px minmax(0, 1fr) 70px; gap: 8px; align-items: center; font-size: 12.5px; padding: 3px 0; }
.hbar .track { height: 14px; background: var(--surface-2); border-radius: 4px; position: relative; overflow: hidden; }
.hbar .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--s1); border-radius: 0 4px 4px 0; }
.hbar .track i.op { background: var(--hi); opacity: .85; }
.hbar .v { text-align: right; font-family: var(--f-num); font-size: 12px; color: var(--ink-2); }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--surface); padding: 7px 10px; border-radius: 7px; font-size: 12px; line-height: 1.5; box-shadow: var(--shadow); max-width: 260px; }
.tip[hidden] { display: none; }
.rep { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rep li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 7px; background: var(--surface-2); }
.rep .rk { font-family: var(--f-num); color: var(--muted); font-size: 12px; }
.rep .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }

.notice { border-left: 3px solid var(--mid); background: var(--mid-soft); padding: 10px 12px; border-radius: 0 7px 7px 0; font-size: 13px; color: var(--ink); }
.notice.ok { border-color: var(--lo); background: var(--lo-soft); }
.notice.info { border-color: var(--ex); background: var(--ex-soft); }
.qlist { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; }
.drop { border: 2px dashed var(--line-2); border-radius: 10px; padding: 24px; text-align: center; color: var(--ink-2); cursor: pointer; background: var(--surface-2); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.zone-list { display: grid; gap: 6px; }
.zone-it { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
.zone-it .nm { font-weight: 600; font-size: 13px; }
.thumb { width: 64px; height: 48px; object-fit: cover; border-radius: 5px; border: 1px solid var(--line); }
.photos { display: flex; gap: 10px; flex-wrap: wrap; }
.photos figure { margin: 0; display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.photos img { width: 220px; max-width: 100%; border-radius: 7px; border: 1px solid var(--line); }

/* login */
.login { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); overflow: auto; }
.login-box { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.login-box h1 { font-size: 20px; }
.demo-users { display: grid; gap: 6px; }
.demo-users button { text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 9px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.demo-users button:hover { border-color: var(--accent); }

/* modal */
.modal { position: fixed; inset: 0; z-index: 55; background: rgba(10, 18, 14, .45); display: grid; place-items: center; padding: 16px; overflow: auto; }
.modal[hidden] { display: none; }
.modal-box { width: min(860px, 100%); background: var(--surface); border-radius: 12px; padding: 20px; display: grid; gap: 14px; max-height: calc(100vh - 32px); overflow: auto; }
.modal-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 8px; z-index: 70; font-size: 13px; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.toast[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) { .card, .kpi { transition: border-color .15s; } }
@media (max-width: 640px) {
  .brand-s { display: none; }
  .top-r { margin-left: 0; width: 100%; justify-content: space-between; }
  .kv { grid-template-columns: 1fr; }
  .hbar { grid-template-columns: 76px minmax(0, 1fr) 60px; }
}

/* ===== 추가: 평가 종류 · 현황표 · 관리규정 · 사진 ===== */
#sel-year { width: auto; padding: 4px 8px; font-weight: 600; font-size: 13px; }
#year-banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#year-banner[hidden] { display: none; }
.tcards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tcard { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: grid; gap: 4px; font: inherit; color: inherit; min-width: 0; }
.tcard:hover { border-color: var(--line-2); }
.tcard.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--accent-soft); }
.tc-h { display: flex; justify-content: space-between; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.tc-v { font-size: 22px; font-weight: 600; line-height: 1.2; }
.tc-v small { font-size: 12px; color: var(--muted); margin-left: 2px; }
@media (max-width: 900px) { .tcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.chart text.vl { fill: var(--ink); font-weight: 600; font-family: var(--f-num); font-size: 11px; }
.t-stat th, .t-stat td { padding: 5px 6px; font-size: 12.5px; }
.t-stat tbody th { background: var(--surface-2); white-space: nowrap; }
.t-stat tr.rate td { font-weight: 700; color: var(--accent); }
.pill.g0 { background: #8f1d14; color: #fff; } .pill.g1 { background: var(--hi-soft); color: var(--hi); } .pill.g2 { background: var(--mid-soft); color: var(--mid); }
.pill.g3 { background: var(--g3-bg); color: var(--g3-fg); } .pill.g4 { background: var(--lo-soft); color: var(--lo); } .pill.g5 { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
td.g0 { background: #8f1d14; color: #fff; } td.g1 { background: var(--hi-soft); color: var(--hi); } td.g2 { background: var(--mid-soft); color: var(--mid); } td.g3 { background: var(--g3-bg); color: var(--g3-fg); } td.g4 { background: var(--lo-soft); color: var(--lo); } td.g5 { background: var(--surface-2); color: var(--muted); }
.rlay { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; align-items: start; }
.rtoc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); display: grid; gap: 2px; padding: 10px; max-height: calc(100vh - 110px); overflow: auto; }
.rtoc a { color: var(--ink-2); text-decoration: none; font-size: 13px; padding: 5px 8px; border-radius: 6px; }
.rtoc a:hover { background: var(--surface-2); color: var(--ink); }
.rdoc { display: grid; gap: 12px; min-width: 0; }
.rsec { display: grid; gap: 10px; }
.rsec-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
.rsec-h h2 { font-size: 16px; }
.rtext { max-width: 78ch; }
.rtext p { margin: 0 0 3px; line-height: 1.75; }
.rsub { font-size: 13.5px; margin: 10px 0 4px; color: var(--accent); }
.rb { padding-left: 16px; position: relative; } .rb::before { content: "·"; position: absolute; left: 5px; font-weight: 700; }
.ri { padding-left: 12px; }
.rnote { color: var(--ink-2); font-size: 13px; background: var(--surface-2); padding: 5px 9px; border-radius: 6px; }
.rgap { height: 6px; }
.rtab td, .rtab th { font-size: 13px; line-height: 1.55; }
.rtab td:first-child { white-space: nowrap; font-weight: 600; }
.rrole { font-size: 11.5px; color: var(--ex); font-weight: 600; }
.rfig { margin: 0; display: grid; gap: 4px; justify-items: start; }
.rfig img { max-height: 420px; width: auto; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.rfig figcaption { font-size: 12px; color: var(--muted); }
.rmx th, .rmx td { text-align: center; padding: 6px; }
.rmx td b { display: block; font-size: 15px; }
.rmx td span { font-size: 11px; }
.rdg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.rd { border: 1px solid var(--line); border-left: 4px solid var(--line-2); border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.rd.ok { border-left-color: var(--lo); } .rd.warn { border-left-color: var(--mid); } .rd.bad { border-left-color: var(--hi); } .rd.info { border-left-color: var(--ex); }
.rd-k { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.rd-v { font-size: 17px; overflow-wrap: anywhere; font-weight: 600; font-family: var(--f-num); }
.rd-s { font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
@media (max-width: 900px) { .rlay { grid-template-columns: minmax(0, 1fr); } .rtoc { position: static; max-height: none; grid-template-columns: repeat(2, minmax(0, 1fr)); } .rdg { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.edb { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; }
.edb-h { display: flex; gap: 6px; align-items: center; }
.edt td, .edt th { padding: 3px; border: 0; background: none; }
.edt textarea, .edt input { min-height: 0; font-size: 12.5px; padding: 5px 6px; }
.phwrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.phg { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 8px; align-content: start; }
.phg-h { display: flex; gap: 8px; align-items: center; }
.phg-h label.btn { margin-left: auto; }
.phs { display: flex; gap: 8px; flex-wrap: wrap; }
.ph { position: relative; }
.ph img { width: 110px; height: 84px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
.phx { position: absolute; top: 3px; right: 3px; border: 0; background: rgba(0, 0, 0, .65); color: #fff; border-radius: 999px; min-width: 22px; height: 22px; font-size: 12px; cursor: pointer; padding: 0 6px; }
.lightbox { position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, .85); display: grid; place-items: center; align-content: center; gap: 8px; padding: 20px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 85vh; border-radius: 8px; }
.lightbox span { color: #ddd; font-size: 12px; }
@media (max-width: 640px) { .phwrap { grid-template-columns: minmax(0, 1fr); } }
/* 사진: 목록 썸네일 · 사진 카드 */
.tbp { display: inline-flex; align-items: center; gap: 4px; }
.tbp b { color: var(--muted); font-weight: 600; }
.tbx { position: relative; display: inline-grid; place-items: center; width: 64px; height: 48px; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); font-size: 10px; color: var(--muted); text-align: center; line-height: 1.2; }
.tbx img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tbx i { position: absolute; right: 2px; bottom: 2px; font-style: normal; font-size: 10px; background: rgba(0, 0, 0, .6); color: #fff; border-radius: 4px; padding: 0 4px; }
.pcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.pcard { text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: grid; gap: 6px; cursor: pointer; min-width: 0; }
.pcard:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.pc-top, .pc-b { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.pc-ph { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pc-ph figure { margin: 0; display: grid; gap: 3px; }
.pc-ph img, .pc-ph .ph-none { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; background: var(--surface-2); color: var(--muted); font-size: 12px; }
.pc-ph figcaption { font-size: 11px; color: var(--muted); }
.pc-t { font-size: 13px; }
.phg .ph img { width: 200px; height: 150px; }
@media (max-width: 640px) { .phg .ph img { width: 140px; height: 105px; } }
.rd.clk { cursor: pointer; text-align: left; font: inherit; color: inherit; background: var(--surface); }
.rd.clk:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.rd.clk .rd-s::after { content: " · 눌러서 보기"; color: var(--accent); }
button.kpi.clk { text-align: left; font: inherit; color: inherit; cursor: pointer; }
button.kpi.clk:hover, .hbar.clk:hover, .rep li.clk:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
.hbar.clk, .rep li.clk { cursor: pointer; border-radius: 6px; border: 1px solid transparent; }
.hbar.clk:hover { background: var(--surface-2); }

/* 감소대책 유형 */
.ctlpick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 4px; }
.ctlpick .cp { position: relative; display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 10px; cursor: pointer; background: var(--surface); font-weight: 400; }
.ctlpick .cp input { width: auto; margin-top: 2px; }
.ctlpick .cp span { display: grid; gap: 2px; }
.ctlpick .cp b { font-size: 13px; color: var(--ink); }
.ctlpick .cp small { font-size: 11.5px; color: var(--ink-3, var(--ink-2)); line-height: 1.35; }
.ctlpick .cp:has(input:checked) { border-color: var(--accent, var(--s1)); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--accent, var(--s1)); }
.ctlpick .cp.sug, .cbtn.sug { border-style: dashed; border-color: var(--s1); }
.ctlpick .cp em, .cbtn.sug::after { position: absolute; top: -8px; right: 8px; font-style: normal; font-size: 10.5px; font-weight: 700; background: var(--s1); color: #fff; border-radius: 4px; padding: 0 5px; }
#r-ctlbox.bad .ctlpick .cp { border-color: var(--hi); }
#r-ctlbox > span { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.req { color: var(--hi); font-size: 11px; font-weight: 700; margin-left: 2px; }
#d-ctl .ctlpick { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ctags { display: inline-flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.ctag { display: inline-block; font-size: 11px; line-height: 1.6; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line-2); white-space: nowrap; color: var(--ink-2); background: var(--surface-2); }
.ctag.none { border-style: dashed; color: var(--ink-3, var(--ink-2)); background: transparent; margin-top: 4px; }
.ctag.c0, .cbtn.c0[aria-pressed="true"] { --cc: #1f7a4d; }
.ctag.c1, .cbtn.c1[aria-pressed="true"] { --cc: #2563a8; }
.ctag.c2, .cbtn.c2[aria-pressed="true"] { --cc: #a86412; }
.ctag.c3, .cbtn.c3[aria-pressed="true"] { --cc: #7a4aa8; }
.ctag[class*=" c"] { color: var(--cc); border-color: color-mix(in srgb, var(--cc) 40%, transparent); background: color-mix(in srgb, var(--cc) 10%, transparent); }
.hbar .track i.ct.c0 { background: #1f7a4d; } .hbar .track i.ct.c1 { background: #2563a8; } .hbar .track i.ct.c2 { background: #c07a1f; } .hbar .track i.ct.c3 { background: #8a5ab8; }
.modal-box.wide { width: min(1080px, 100%); }
.ctl-legend { display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; align-items: center; }
.cc-wrap { max-height: 56vh; overflow: auto; }
.cc td { vertical-align: top; }
.cc-btns { display: flex; flex-wrap: nowrap; gap: 5px; min-width: 400px; }
.cbtn { position: relative; font: inherit; font-size: 12.5px; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.cbtn[aria-pressed="true"] { color: #fff; background: var(--cc); border-color: var(--cc); border-style: solid; font-weight: 600; }
.cbtn.sug::after { content: '추천'; top: -9px; right: -4px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ctag[class*=" c"] { color: color-mix(in srgb, var(--cc) 55%, #fff); } }
:root[data-theme="dark"] .ctag[class*=" c"] { color: color-mix(in srgb, var(--cc) 55%, #fff); }
@media (max-width: 720px) { .ctlpick { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cc-btns { min-width: 0; flex-wrap: wrap; } }

/* 안전사고 */
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 980px) { .grid3 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
@media (max-width: 640px) { .grid3 { grid-template-columns: minmax(0, 1fr); } }
#v-acc .kpis { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 980px) { #v-acc .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
#v-acc button.kpi { text-align: left; font: inherit; color: inherit; cursor: pointer; }
.accy { width: 100%; height: auto; display: block; }
.accy .cv { font-size: 12px; fill: var(--ink-2); font-family: var(--f-num); }
.accy .cx { font-size: 11.5px; fill: var(--muted); font-family: var(--f-num); }
.accy .clk { cursor: pointer; }
.accy .clk:hover rect:not([fill="transparent"]), .accy .clk.on rect:not([fill="transparent"]) { opacity: .8; }
.accy .clk.on .cx { fill: var(--ink); font-weight: 700; }
.hbar.on { background: var(--surface-2); border-color: var(--line-2); }
.ins { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 13.5px; line-height: 1.55; }
table.acc td { vertical-align: top; }

/* 재해지수 */
input[type="number"] { font: inherit; padding: 7px 9px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--surface); color: var(--ink); width: 100%; }
.subtabs { margin-bottom: 14px; }
.kcards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1100px) { .kcards { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .kcards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kc { border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; display: grid; gap: 5px; background: var(--surface); }
.kc-h { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.kc .st { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; }
.kc .st.ok { background: var(--lo-soft); color: var(--lo); } .kc .st.bad { background: var(--hi-soft); color: var(--hi); }
.kc.bad { border-color: color-mix(in srgb, var(--hi) 45%, var(--line)); }
.kc-v { font-family: var(--f-num); font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
.kc-v small { font-size: 12px; color: var(--muted); margin-left: 2px; }
.kc-b { position: relative; height: 6px; background: var(--surface-2); border-radius: 3px; }
.kc-b i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--lo); }
.kc.bad .kc-b i { background: var(--hi); }
.kc-b b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.kc-s { font-size: 11.5px; color: var(--muted); }
table.kt td, table.kt th { white-space: nowrap; }
table.kt tr.sum td { border-top: 2px solid var(--line-2); background: var(--surface-2); }
table.kin-t th, table.kin-t td { padding: 3px 4px; white-space: nowrap; }
table.kin-t th.ksec { text-align: left; background: var(--surface-2); padding: 8px; font-size: 13px; }
table.kin-t tbody th { text-align: left; font-weight: 500; font-size: 12.5px; color: var(--ink-2); padding-right: 8px; }
table.kin-t tr.ro td { color: var(--ink-2); }
input.kin { width: 72px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 12.5px; text-align: right; }
input.kin::placeholder { color: var(--muted); opacity: .9; }
input.kin.set { border-color: var(--accent); font-weight: 600; background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
#v-acc .pagehead select { width: auto; min-width: 110px; }
.rs-confirm { border: 1px solid color-mix(in srgb, var(--hi) 45%, var(--line)); background: var(--hi-soft); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; }
.rs-confirm b { color: var(--hi); font-size: 15px; }

/* ===== UI 정리 (2026-10): 심플 · 고급 · 소방 대시보드와 같은 구조 ===== */
:root:not([data-theme="dark"]) {
  --bg: #f4f5f3; --surface: #ffffff; --surface-2: #f6f7f5; --line: #e4e7e2; --line-2: #d3d8d1;
  --ink: #111a16; --ink-2: #4a5550; --muted: #7d8782; --accent: #0b5d45; --accent-soft: #e6f1ec;
  --shadow: 0 1px 2px rgba(16, 26, 22, .04), 0 6px 20px rgba(16, 26, 22, .05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1412; --surface: #161d1a; --surface-2: #1b2420; --line: #26302b; --line-2: #33403a; } }
body { font-size: 14px; letter-spacing: -.005em; -webkit-font-smoothing: antialiased; }
/* 상단: 1줄 브랜드·사용자 / 2줄 아이콘 탭 */
.top { box-shadow: 0 1px 0 var(--line); border-bottom: 0; }
.top-in { padding-block: 12px; gap: 14px; }
.brand { background: none; border: 0; padding: 4px 8px 4px 4px; margin: -4px 0 -4px -4px; border-radius: 12px; cursor: pointer; text-align: left; color: inherit; font: inherit; transition: background .15s; }
.brand:hover { background: var(--surface-2); }
.brand-mark { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(145deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #000)); box-shadow: 0 2px 6px color-mix(in srgb, var(--accent) 35%, transparent); }
.brand-mark svg { width: 21px; height: 21px; color: #fff; }
.brand-tx { display: grid; line-height: 1.25; }
.brand-t { font-size: 16px; font-weight: 700; letter-spacing: -.025em; }
.brand-s { font-size: 12px; color: var(--muted); }
.top-r { gap: 10px; }
.top-r select { width: auto; height: 36px; border-radius: 9px; padding: 0 10px; font-weight: 600; font-size: 13px; }
.mode { height: 24px; display: inline-flex; align-items: center; }
.user { gap: 10px; padding: 3px 4px 3px 4px; border: 1px solid var(--line); border-radius: 12px; }
.uav { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.u-tx { display: grid; line-height: 1.2; }
.u-tx b { font-size: 13px; }
.tabs { display: block; border-top: 1px solid var(--line); }
.tabs-in { max-width: 1320px; margin: 0 auto; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs-in::-webkit-scrollbar { display: none; }
.tab { display: inline-flex; align-items: center; gap: 7px; padding: 12px 14px 11px; border-radius: 0; border-bottom: 2.5px solid transparent; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; background: none; }
.tab svg { width: 17px; height: 17px; flex: none; }
.tab:hover { background: none; color: var(--ink); }
.tab[aria-selected="true"] { background: none; color: var(--ink); border-bottom-color: var(--ink); font-weight: 700; }
.tab[aria-selected="true"] svg { color: var(--accent); }
@media (max-width: 760px) {
  .brand-s, .u-tx, .mode { display: none; }
  .top-in { padding-block: 8px; }
  .user { border: 0; padding: 0; }
  .tab { padding: 10px 11px; font-size: 13px; }
}
/* 본문 */
main { padding-block: 24px 64px; gap: 18px; }
.view { gap: 18px; }
.pagehead { margin-bottom: 2px; }
.pagehead h1 { font-size: 24px; font-weight: 700; letter-spacing: -.03em; }
.pagehead p { font-size: 13px; color: var(--muted); }
.card { border-radius: 14px; padding: 20px; border-color: var(--line); }
.card-h { margin-bottom: 14px; }
.card-h h2 { font-size: 15.5px; font-weight: 700; letter-spacing: -.02em; }
.kpi, .tcard, .kc { border-radius: 14px; }
.kpi { padding: 16px 18px; gap: 4px; }
.kpi-v { font-size: 28px; }
.tcard { padding: 16px 18px; gap: 6px; transition: border-color .15s, box-shadow .15s; }
.tcard:hover, button.kpi.clk:hover, #v-acc button.kpi:hover { box-shadow: var(--shadow); border-color: var(--line-2); }
.tcard.on { background: var(--surface); border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.btn { border-radius: 9px; padding: 8px 14px; transition: background .15s, border-color .15s; }
.btn.sm { border-radius: 8px; padding: 5px 10px; }
.btn:hover { border-color: var(--ink-2); }
.btn.pri { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.pri:hover { filter: none; background: color-mix(in srgb, var(--ink) 85%, var(--accent)); }
.btn.ghost:hover { background: var(--surface-2); border-color: transparent; }
.btn.danger { border-color: color-mix(in srgb, var(--hi) 40%, var(--line-2)); }
.chip { padding: 5px 12px; transition: border-color .15s; }
.chip:hover { border-color: var(--ink-2); }
input[type="text"], input[type="password"], input[type="date"], input[type="search"], input[type="number"], select, textarea { border-radius: 9px; }
table.items th { font-weight: 600; font-size: 12px; color: var(--muted); letter-spacing: .01em; }
.modal-box { border-radius: 18px; padding: 24px; box-shadow: 0 24px 60px rgba(0, 0, 0, .18); }
.login-box { border-radius: 18px; }
.login .brand-mark { width: 40px; height: 40px; }
/* 첫 화면: 지금 할 일 */
.focus { display: grid; gap: 12px; }
.focus-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.focus-h h2 { font-size: 17px; letter-spacing: -.02em; }
.focus-h .sub { font-size: 12px; color: var(--muted); }
.fcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.fcard { text-align: left; font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: grid; gap: 6px; cursor: pointer; position: relative; transition: box-shadow .15s, border-color .15s, transform .15s; }
.fcard:hover { box-shadow: var(--shadow); border-color: var(--line-2); transform: translateY(-1px); }
.fcard:not(.ok) { border-color: color-mix(in srgb, var(--hi) 30%, var(--line)); }
.f-h { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.f-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--hi); box-shadow: 0 0 0 4px var(--hi-soft); }
.f-ok { font-style: normal; width: 18px; height: 18px; border-radius: 50%; background: var(--lo-soft); color: var(--lo); display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.f-v { font-size: 34px; font-weight: 600; letter-spacing: -.03em; line-height: 1.1; }
.f-v small { font-size: 14px; color: var(--muted); margin-left: 3px; font-weight: 500; }
.fcard.ok .f-v { color: var(--muted); }
.f-s { font-size: 12.5px; color: var(--muted); min-height: 18px; }
.f-s .warn { color: var(--hi); font-weight: 600; }

      { type: 'text', text: '【목적】\n본 위험성평가는 대상㈜ 횡성공장 내 시설물 및 설비, 작업자의 불안전한 행동을 포함한 위험요인을 발견하여 이를 평가·개선함으로써 사고예방 및 쾌적한 작업환경 조성으로 근로자의 안전을 확보하는 데 그 목적이 있다.\n\n【근거】\n- 산업안전보건법 제36조(위험성평가)\n- 사업장 위험성평가에 관한 지침 (고용노동부 고시 제2024-76호, 2024.12.18)\n\n【범위 및 대상】\n위험성평가는 대상㈜ 횡성공장 내 각 공정 전반을 평가 범위로 하며, 평가 대상은 다음과 같다.\n- 협력업체를 포함한 회사 또는 외부에서 작업장에 제공되는 모든 위험시설\n- 작업장에서 보유 또는 취급하고 있는 모든 유해물질\n- 일상적인 작업(용역업체 포함) 및 비일상적인 작업(수리 또는 정비 등)' }] },
    { id: 'terms', title: '용어 정의', blocks: [
      { type: 'text', text: '【위험성평가 (Risk assessment)】\n유해·위험요인을 파악하여 해당 유해·위험요인이 사고 또는 질병으로 이어질 수 있는 가능성과 중대성을 계산하고 감소대책을 수립하여 적절한 조치를 마련하여 실행하는 일련의 과정을 말한다.\n\n【유해·위험요인 (Hazard)】\n유해·위험을 일으킬 잠재적 가능성이 있는 것의 고유한 특징이나 속성을 말한다. 예를 들면 기계기구, 설비, 전기, 폭발성물질 등에 대한 위험요인과 가스, 소음, 진동, 분진 등에 의한 유해·위험요인을 말한다.\n\n【위험성 (Risk)】\n유해·위험요인이 사고 또는 질병으로 이어질 수 있는 가능성(빈도)과 중대성(강도) 등을 고려한 위험의 정도를 말한다.\n\n【위험성 결정 (Risk evaluation)】\n유해·위험요인별 위험성 계산값에 따라 허용할 수 있는 범위인지, 허용할 수 없는 범위인지를 판단하기 위해 현재의 위험한 상태를 결정하는 것을 말한다.\n\n【허용 가능한 위험 (Acceptable risk)】\n결정된 허용 위험 수준 이하의 위험 또는 개선에 의하여 허용 위험 수준 이하로 감소된 위험을 말한다.\n\n【위험성 감소대책 수립 및 실행 (Risk control action & implementation)】\n위험성평가 후 도출된 위험을 허용 가능한 위험으로 감소하기 위해 수립하는 개선대책과 실행을 말한다.\n\n【근로자 참여】\n담당업무에 대한 위험성평가 참여 및 업무에 대한 안전보건수칙 준수, 위험성평가 결과 및 감소대책 이행, 비상상황에 대한 대비 및 대응방법 숙지' }] },
    { id: 'roles', title: '조직의 역할과 책임', blocks: [
      { type: 'text', text: '【안전보건관리(총괄)책임자】\n1) 해당 사업장에서 위험성평가에 관한 사업주의 방침을 시행\n2) 해당 사업장에서 위험성평가의 실시를 총괄 관리\n3) 추진목표를 문서화하고 위험성평가 실행을 위한 조직 구성\n4) 예산 지원 및 산업재해예방에 최우선 이행\n\n【관리감독자】\n1) 안전보건관리책임자의 위험성평가에 대한 의향을 근로자에게 올바르게 전달\n2) 위험성평가를 실시하기 위한 인원의 배치\n3) 관계자에 대한 교육 훈련을 실시\n4) 위험성평가의 실시를 관리하고 평가\n\n【위험성평가 담당자 (관리감독자와 겸직 가능)】\n1) 위험성평가의 실시 계획 수립 및 개선조치 실행\n2) 안전보건 정보수집 및 재해조사 관련 자료 등 기록\n3) 위험성평가 교육 실시 및 결과에 대한 기록 관리\n\n【안전관리자 및 보건관리자】\n1) 안전보건관리책임자를 보좌하고 관리감독자에 대하여 지도·조언\n2) 위험성평가를 위한 체계 구축' }] },

    { id: 'procedure', title: '위험성평가 절차', blocks: [
      { type: 'text', text: '【단계별 절차】\n1단계 사전준비 ▶ 2단계 유해·위험요인 파악 ▶ 3단계 위험성 추정 ▶ 4단계 위험성 결정 ▶ 5단계 위험성 감소대책 수립 및 실행 ▶ 6단계 위험성 기록' },
      { type: 'image', img: 'flow', caption: '위험성평가 절차 도해' },
      { type: 'text', text: '※ 위험성평가는 한 번에 완료되는 것이 아니므로, 위험성이 허용 가능한 수준이 될 때까지 반복적으로 실시한다.\n\n【1단계 사전준비】\n작업(공정) 흐름도에 따라 평가대상을 확정하고 안전보건정보를 조사하며, 위험성평가 담당자는 위험성평가에 필요한 정보를 수집하여 정리한다.\n\n【2단계 유해·위험요인 파악】\n결정된 평가대상 공정 또는 작업에 대하여 안전보건상의 위험요인을 파악한다. 위험요인 파악은 작업자와 평가자가 참여하여 토의, 설문지, 현장의 아차사고 경험 여부 확인 등으로 진행하며, 위험요인을 분류한다.\n\n【3단계 위험성 추정】\n1) 파악된 유해·위험요인에 대하여 위험발생 가능성 및 중대성을 결정한다.\n2) 위험성 추정은 사고발생 가능성(5단계)과 사고결과의 중대성(4단계)을 곱하여 산출한다. (위험성 = 가능성 5 × 중대성 4)' }] },

    { id: 'grades', title: '위험성 결정 (4단계) 기준', blocks: [
      { type: 'text', text: '1) 파악된 유해·위험요인이 받아들여질 만한(Acceptable) 수준인지, 즉 허용 가능한지(Tolerable) 여부를 판단하는 단계이다.\n2) 위험성의 크기가 안전한 수준이라고 판단(결정)되면 잔류 위험성(Residual risk)이 어느 정도 존재하는지를 명기하고 종료 절차에 들어간다. 안전한 수준이라고 인정되지 않으면 위험성을 감소시키는 조치(대책)를 수립하는 절차를 반복한다.' },

    { id: 'control', title: '위험성 감소대책 수립 · 실행 및 기록', blocks: [
      { type: 'text', text: '【5단계 위험성 감소대책 수립 및 실행】\n위험성 결정에서 허용할 수 없는 위험(허용 불가능)에 대하여 개선대책을 수립·실행하여 허용 가능 범위로 들어오도록 하고, 필요 시 감소대책을 실행한다.\n위험성 수준이 높은 것부터 우선적으로 위험성 감소대책을 반영하여 개선한다.' },
      { type: 'image', img: 'control', caption: '감소대책 수립의 우선순위: ① 본질적(근원적) 대책 → ② 공학적 대책 → ③ 관리적 대책 → ④ 개인보호구의 사용' },
      { type: 'text', text: '【6단계 위험성 기록】\n보고서는 평가 협의 및 객관적 사실에 의하여 기록하여야 한다.\n위험성평가를 수행한 결과를 관계자에게 교육하거나 공유하기 위하여 기록한다.' }] },

    ['1. 기계(설비)적 요인', ['1.1 협착위험 부분(감김, 끼임)', '1.2 위험한 표면(절단, 베임, 긁힘)', '1.3 기계(설비)의 낙하, 비래, 전복, 붕괴, 전도 위험', '1.4 충돌위험 부분', '1.5 넘어짐(미끄러짐, 걸림, 헛디딤)', '1.6 추락위험 부분(개구부 등)']],
    ['2. 전기적 요인', ['2.1 감전(안전전압 초과)', '2.2 아크', '2.3 정전기', '2.4 화재 / 폭발 위험']],
    ['3. 화학(물질)적 요인', ['3.1 가스', '3.2 증기', '3.3 에어로졸·흄', '3.4 액체·미스트', '3.5 고체(분진)', '3.6 반응성 물질', '3.7 방사선', '3.8 화재 / 폭발 위험', '3.9 산소결핍·질식']],
    ['4. 생물학적 요인', ['4.1 병원성 미생물, 바이러스', '4.2 유전자 변형물질', '4.3 알레르기 및 미생물', '4.4 동물', '4.5 식물']],
    ['5. 작업특성 요인', ['5.1 소음', '5.2 초음파·초저주파음', '5.3 진동', '5.4 근로자 실수(휴먼에러)', '5.5 저압 또는 고압상태', '5.6 질식위험·산소결핍', '5.7 중량물 취급작업', '5.8 반복작업', '5.9 불안정한 작업자세', '5.10 작업(조작)도구']],
    ['6. 작업환경 요인', ['6.1 기후 / 고온 / 한랭', '6.2 조명', '6.3 공간 및 이동통로', '6.4 주변 근로자', '6.5 작업시간', '6.6 조직 안에서의 권한·책임']],
  ];

  // 사고유형(재해형태) 정규화 — 분석 차트용
  const HAZARD_TYPES = [
    ['화재·폭발', ['화재', '폭발', '유도등', '소화', '비상조명', '발신기', '방화', '연동제어', '스프링클러', '감지기']],
    ['방사선', ['방사선', 'x-ray', 'xray', '엑스선', '피폭']],
    ['추락', ['추락', '난간', '개구부', '고소']],
    ['끼임·감김', ['끼임', '협착', '감김', '방호울', '방호커버', '말림']],
    ['감전', ['감전', '전기', '판넬', '분전반', '누전', '차단기', '전선', '콘센트']],
    ['넘어짐', ['넘어짐', '미끄', '전도', '걸림', '헛디딤', '발판', '트렌치']],
    ['질식', ['질식', '산소결핍', '밀폐']],
    ['화학물질', ['화학', '미스트', 'msds', '물질', '가스', '약품', '락스', '누액']],
    ['근골격계', ['근골격', '중량물', '반복', '작업자세', '허리']],
    ['베임·절단', ['베임', '절단', '자상', '칼']],
    ['충돌·부딪힘', ['충돌', '부딪', '지게차']],
    ['낙하·깔림', ['낙하', '깔림', '붕괴', '비래', '적재']],
    ['화상', ['화상', '온수', '고온', '스팀']],
  ];

  const nz = (s) => String(s == null ? '' : s).replace(/\s+/g, '').toLowerCase();
  const clean = (s) => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();

  function hazardType(it) {
    const fields = [it.haz, it.cat, it.sit + ' ' + it.act];
    for (const f of fields) {
      const t = nz(f);
      if (!t) continue;
      for (const [name, kws] of HAZARD_TYPES) if (kws.some((k) => t.includes(k))) return name;
    }
    return '기타';
  }

  function matchZone(text, team) {
    const t = nz(text);
    if (!t) return null;
    const pool = ZONES.filter((z) => !team || z.team === team);
    for (const z of pool) for (const group of z.kw) if (group.every((k) => t.includes(nz(k)))) return z;
    return null;
  }
  function zoneFromFilename(fn) {
    const t = nz(fn).replace(/\.xls[xm]?$/, '');
    // 구체적인 것부터: 원포자재검수실 ↔ 포자재창고, 원자재창고
    const order = ['qa-insp', 'sp-raw', 'sp-pack', 'qa-lab1', 'qa-lab2', 'pm-aw2', 'hc-aw1'];
    const pool = [...order.map((id) => ZONES.find((z) => z.id === id)), ...ZONES.filter((z) => !order.includes(z.id))];
    for (const z of pool) if (z.kw.slice(0, 1).some((g) => g.every((k) => t.includes(nz(k))))) return z;
    for (const z of pool) for (const g of z.kw) if (g.every((k) => t.includes(nz(k)))) return z;
    return null;
  }

  const TEAM_ALIASES = { '에방보전팀': '예방보전팀', '예방보전': '예방보전팀', '공무팀': '예방보전팀', 'she': 'SHE팀', 'she팀': 'SHE팀', 'qa': 'QA팀', '품질': 'QA팀', '생산': '생산팀', '지원': '지원팀', '센터': '횡성센터' };
  function normTeam(s) {
    const c = clean(s);
    if (!c) return '';
    if (TEAMS.includes(c)) return c;
    const k = nz(c);
    if (TEAM_ALIASES[k]) return TEAM_ALIASES[k];
    const hit = TEAMS.find((t) => nz(t) === k);
    return hit || c;
  }

  // '9월 15일', '8월4일', '5월', Date, '2026.09.01', '2026-09-01' → {m, d}
  function parseMD(v, defY) {
    if (v == null || v === '') return null;
    if (v instanceof Date && !isNaN(v)) return { y: v.getFullYear(), m: v.getMonth() + 1, d: v.getDate() };
    if (typeof v === 'number' && v > 20000 && v < 80000) { // 엑셀 일련번호
      const dt = new Date(Math.round((v - 25569) * 864e5));
      return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() + 1, d: dt.getUTCDate() };
    }
    const s = String(v);
    let m = s.match(/(20\d{2})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})?/);
    if (m) return { y: +m[1], m: +m[2], d: m[3] ? +m[3] : 1 };
    m = s.match(/(\d{1,2})\s*월\s*(\d{1,2})?\s*일?/);
    if (m && +m[1] >= 1 && +m[1] <= 12) return { y: defY || YEAR, m: +m[1], d: m[2] ? +m[2] : 1, noY: true };
    m = s.match(/^(\d{1,2})[./](\d{1,2})$/);
    if (m && +m[1] <= 12) return { y: defY || YEAR, m: +m[1], d: +m[2], noY: true };
    return null;
  }
  const mdText = (p) => (p ? `${p.m}월 ${p.d}일` : '');
  const toISO = (p) => (p ? `${p.y}-${String(p.m).padStart(2, '0')}-${String(p.d).padStart(2, '0')}` : '');
  const num = (v) => { const n = parseFloat(v); return isFinite(n) ? n : null; };

  // ---------- 팀 위험성평가 엑셀(평가표) 파서 ----------
  // 시트 '위험성평가표'에서 월별 블록(평가일 → 헤더 '위험번호' → 데이터행)을 찾아 읽는다.
  const HEAD_KEYS = {
    no: ['위험번호'], place: ['장소'], cat: ['분류'], haz: ['위험요인'], sit: ['위험발생상황및결과', '위험발생상황', '상황및결과'],
    f1: ['현재빈도'], s1: ['현재강도'], r1: ['현재위험성'], act: ['개선대책'], f2: ['개선빈도'], s2: ['개선강도'],
    r2: ['개선후위험성'], dept: ['담당부서'], owner: ['담당자'], due: ['조치요구일', '조치요구'], done: ['개선완료일', '완료일', '조치완료'],
  };
  function parseTeamWorkbook(XLSX, data, filename) {
    const wb = XLSX.read(data, { type: 'array', cellDates: true, sheets: undefined, bookSheets: true });
    const names = wb.SheetNames;
    const target = names.find((n) => nz(n) === '위험성평가표') || names.find((n) => nz(n).includes('위험성평가표')) || names.find((n) => nz(n).includes('평가표')) || names.find((n) => nz(n).includes('위험성평가'));
    if (!target) return { error: `'위험성평가표' 시트를 찾지 못했습니다 (시트: ${names.join(', ')})` };
    const ctlSheet = names.find((n) => nz(n).includes('감소대책'));
    const wb2 = XLSX.read(data, { type: 'array', cellDates: true, sheets: ctlSheet ? [target, ctlSheet] : [target] });
    const ws = wb2.Sheets[target];
    const ctlRecs = [];
    if (ctlSheet && wb2.Sheets[ctlSheet]) {
      const cr = XLSX.utils.sheet_to_json(wb2.Sheets[ctlSheet], { header: 1, raw: true, defval: null, blankrows: true });
      let pos = null, cur = null;
      for (let r = 0; r < cr.length; r++) {
        const row = cr[r] || [];
        const i1 = row.findIndex((c) => /근본적대책|본질적대책/.test(nz(c)));
        if (i1 >= 0) {
          pos = CTLS.map(([k]) => row.findIndex((c) => nz(c).includes(k === '개인보호구' ? '개인보호구' : k + '대책')));
          const vals = cr[r + 1] || [];
          cur = { ctl: CTLS.filter((_, k) => pos[k] >= 0 && /해당|o|●|■|v/i.test(String(vals[pos[k]] || '')) && !/#n\/a/i.test(String(vals[pos[k]]))).map(([k]) => k), sit: '', act: '' };
          ctlRecs.push(cur); continue;
        }
        if (cur) row.forEach((c, i) => { if (nz(c) === '◈') { const txt = clean(row[i + 1]); if (!cur.sit) cur.sit = txt; else if (!cur.act) cur.act = txt; } });
      }
    }
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
    let zone = zoneFromFilename(filename);
    let deptCell = '', zoneCell = '';
    let curMonth = null, curYear = YEAR, cols = null, warnings = [], curType = '상시';
    const items = [];
    const findRight = (row, i) => { for (let j = i + 1; j < Math.min(row.length, i + 6); j++) if (row[j] != null && row[j] !== '') return row[j]; return null; };
    for (let r = 0; r < rows.length; r++) {
      const row = rows[r] || [];
      // 메타
      for (let i = 0; i < row.length; i++) {
        const k = nz(row[i]);
        if (!k) continue;
        if (k === '평가일') { const p = parseMD(findRight(row, i)); if (p) { curMonth = p.m; if (!p.noY) curYear = p.y; cols = null; } }
        else if (k === '평가대상' && !zoneCell) zoneCell = clean(findRight(row, i));
        else if (k === '실시부서' && !deptCell) deptCell = clean(findRight(row, i));
        else if (k === '평가종류') { const v = nz(findRight(row, i)); curType = v.includes('정기') ? '정기' : v.includes('수시') ? '수시' : '상시'; }
      }
      // 헤더
      if (row.some((c) => nz(c) === '위험번호')) {
        cols = {};
        row.forEach((c, i) => {
          const k = nz(c);
          for (const [key, alts] of Object.entries(HEAD_KEYS)) if (cols[key] == null && alts.some((a) => k === a || (a.length > 3 && k.startsWith(a)))) cols[key] = i;
        });
        continue;
      }
      if (!cols || curMonth == null) continue;
      const g = (k) => (cols[k] == null ? null : row[cols[k]]);
      const sit = clean(g('sit')), act = clean(g('act')), haz = clean(g('haz'));
      if (!sit && !act && !haz) continue;
      if (row.some((c) => nz(c) === '평가종류' || nz(c) === '위험성평가표')) continue;
      // 완료일: 헤더가 있으면 그 열, 없으면 조치요구일 오른쪽 첫 값
      let doneRaw = g('done');
      if (doneRaw == null && cols.due != null) for (let j = cols.due + 1; j < Math.min(row.length, cols.due + 7); j++) if (row[j] != null && row[j] !== '') { doneRaw = row[j]; break; }
      const doneTxt = clean(doneRaw instanceof Date ? '' : doneRaw);
      const doneP = parseMD(doneRaw, curYear);
      if (doneP && doneP.noY && doneP.m < curMonth) doneP.y = curYear + 1;
      let status = 'open', exReason = '', note = '';
      if (/제외/.test(doneTxt) || /제외/.test(clean(g('due')))) { status = 'excluded'; exReason = doneTxt || '제외'; }
      else if (doneP) status = 'done';
      else if (doneTxt) note = doneTxt;
      const dueP = parseMD(g('due'), curYear);
      const it = {
        m: curMonth, team: '', zone: '', place: clean(g('place')), cat: clean(g('cat')), haz, sit,
        f1: num(g('f1')), s1: num(g('s1')), r1: num(g('r1')), act, f2: num(g('f2')), s2: num(g('s2')), r2: num(g('r2')),
        dept: normTeam(g('dept')), owner: clean(g('owner')).replace(/\s+/g, ''), due: dueP ? toISO(dueP) : clean(g('due')),
        status, doneDate: status === 'done' ? toISO(doneP) : '', doneM: status === 'done' ? doneP.m : null, doneY: status === 'done' ? doneP.y : null, exReason, note, y: curYear,
        src: '엑셀', file: filename, row: r + 1, kind: 'item', type: curType,
      };
      items.push(it);
    }
    // 감소대책 유형: 위험요인 문구·개선대책이 같은 실행결과 블록과 짝지음
    const usedC = new Set();
    items.forEach((it) => {
      const k = ctlRecs.findIndex((c, i) => !usedC.has(i) && c.ctl.length && nz(c.sit) === nz(it.sit) && (!c.act || nz(c.act) === nz(it.act)));
      if (k >= 0) { usedC.add(k); it.ctl = ctlRecs[k].ctl; }
    });
    if (!zone && zoneCell) zone = matchZone(zoneCell);
    const team = zone ? zone.team : normTeam(deptCell);
    items.forEach((it) => { it.team = team; it.zone = zone ? zone.id : ''; });
    if (!zone) warnings.push('파일명으로 구역을 찾지 못했습니다');
    if (!items.length) warnings.push('평가 항목이 없습니다');
    return { zone, team, items, warnings, sheet: target, zoneCell, deptCell };
  }

  // ---------- 집계 ----------
  // ---------- 평가 기준 (관리규정의 빈도·강도·위험성 결정 기준표에서 읽음)
  const TYPES = ['상시', '정기', '수시'];
  // 감소대책 유형 (관리규정: 감소대책 수립 우선순위)
  const CTLS = [['근본적', '① 근본적(본질적) 대책', '위험한 작업의 폐지·변경, 유해위험물질 대체, 설계·계획 단계에서 위험성 제거'], ['공학적', '② 공학적 대책', '인터록, 안전장치, 방호문, 국소배기장치 등'], ['관리적', '③ 관리적 대책', '매뉴얼 정비, 출입금지, 노출관리, 교육훈련 등'], ['개인보호구', '④ 개인보호구', '①~③으로도 제거·감소할 수 없는 위험에만 사용']];
  // 개선대책 문구로 유형 추천 (사람이 확인 후 확정)
  function suggestCtl(act) {
    const t = nz(act);
    if (!t) return '';
    if (/보호구|장갑|안전화|보안경|마스크|귀마개|안전모|안전대|보호복|장화|방한복|착용/.test(t)) return '개인보호구';
    if (/철거|제거|폐기|대체|이설|없앰|자동화|원격/.test(t)) return '근본적';
    if (/교육|표지|스티커|게시|주지|금지|절차|매뉴얼|점검|청소|정리|정돈|시건|라벨|표시|안내|순회|지정|관리|적치|보관|신호수|유도자|통제|tbm|보수|수리|정상가동|해제|교체|배치|스트레칭|유도선/.test(t)) return '관리적';
    if (/설치|덮개|커버|난간|방호|보수|교체|수리|보강|센서|인터록|가드|도색|패드|부착|보완|조명|배관|울타리|발판|미끄럼|배기|환기|차단|고정|펜스/.test(t)) return '공학적';
    return '';
  }
  const TRIGGERS = ['산업재해 발생', '아차사고 발생', '설비·공정·작업방법 변경', '기타'];
  let CRIT = null;
  const tabOf = (reg, role) => { for (const s of (reg && reg.sections) || []) for (const b of s.blocks || []) if (b.type === 'table' && b.role === role) return b; return null; };
  function setCriteria(reg) {
    const num = (v) => parseInt(String(v).replace(/[^\d]/g, ''), 10);
    const scale = (b, max) => (b ? b.rows.map((r) => ({ v: num(r[2]), name: clean(r[0]), label: clean(r[1]), desc: clean(r[3]) })).filter((x) => x.v >= 1 && x.v <= 10).sort((a, b2) => b2.v - a.v) : []);
    const freq = scale(tabOf(reg, 'freq')), sev = scale(tabOf(reg, 'sev'));
    const gb = tabOf(reg, 'grades');
    let lastAllow = '';
    const grades = (gb ? gb.rows : []).map((r) => {
      const m = String(r[0]).match(/(\d+)\s*(?:[~∼\-]\s*(\d+))?/);
      if (!m) return null;
      if (clean(r[2])) lastAllow = clean(r[2]);
      return { min: +m[1], max: m[2] ? +m[2] : +m[1], name: clean(r[1]), allow: clean(r[2]) || lastAllow, action: clean(r[3]) };
    }).filter(Boolean).sort((a, b) => b.min - a.min);
    const cb = tabOf(reg, 'class');
    const cats = cb ? cb.rows.map((r) => [clean(r[0]), String(r[1] || '').split(/\n|,(?=\s*\d)/).map(clean).filter(Boolean)]).filter((r) => r[0]) : null;
    CRIT = {
      freq: freq.length ? freq : [5, 4, 3, 2, 1].map((v) => ({ v, name: '', label: '', desc: '' })),

        if (sp) { const b = sp.b && sp.b.length ? sp.b : sp.tb ? [sp.tb] : [], a = sp.a && sp.a.length ? sp.a : sp.ta ? [sp.ta] : []; out.before = b.map((d, i) => ({ pid: 'seed:' + i, data: d, seed: 1 })).concat(out.before); out.after = a.map((d, i) => ({ pid: 'seed:' + i, data: d, seed: 1 })).concat(out.after); }
        return out;
      },
      async addPhoto(id, kind, data) { const all = lsGet(PKEY, {}), p = all[id] || {}; const a = Array.isArray(p[kind]) ? p[kind] : p[kind] ? [p[kind]] : []; a.push(data); p[kind] = a; all[id] = p; if (!lsSet(PKEY, all)) throw new Error('브라우저 저장공간이 부족해 사진을 저장하지 못했습니다(데모 모드 한계 · 실제 서버에서는 문제없음)'); },
      async deletePhoto(id, pid) { if (pid.startsWith('seed:')) throw new Error('데모의 기존 취합본 사진은 삭제할 수 없습니다'); const [kind, i] = pid.split(':'), all = lsGet(PKEY, {}), p = all[id] || {}; const a = Array.isArray(p[kind]) ? p[kind] : p[kind] ? [p[kind]] : []; a.splice(+i, 1); p[kind] = a; all[id] = p; lsSet(PKEY, all); },
      async resetDemo() { items = seedItems(); try { localStorage.removeItem(PKEY); } catch (e) {} emit(); },
      subscribeAcc(cb) { accSubs.add(cb); cb(accList()); return () => accSubs.delete(cb); },
      async saveAcc(a) { const L = accList(); const n = Object.assign({}, a, { updatedAt: Date.now() }); if (!n.id) n.id = uid(); const i = L.findIndex((x) => x.id === n.id); if (i >= 0) L[i] = n; else L.push(n); accEmit(L); return n.id; },
      async deleteAcc(id) { accEmit(accList().filter((x) => x.id !== id)); },
      async bulkAcc(arr) { const L = accList(); arr.forEach((a) => L.push(Object.assign({}, a, { id: a.id || uid() }))); accEmit(L); },
      subscribeLogs(cb) { logSubs.add(cb); cb(lsGet('ra-demo-logs', [])); return () => logSubs.delete(cb); },
      async addLog(e) { const L = lsGet('ra-demo-logs', []); L.unshift(Object.assign({ id: uid() }, e)); lsSet('ra-demo-logs', L.slice(0, 1000)); logSubs.forEach((f) => f(L.slice(0, 1000))); },
      subscribeTrash(cb) { trSubs.add(cb); cb(lsGet('ra-demo-trash', [])); return () => trSubs.delete(cb); },

      async addTrash(t) { return this.addTrashMany([t]); },
      async restoreTrash(t) { if (t.kind === 'item') { items.push(Object.assign({}, t.data, { id: t.ref })); emit(); } else if (t.kind === 'acc') { const L = accList(); L.push(Object.assign({}, t.data, { id: t.ref })); accEmit(L); } else if (t.kind === 'photo') { await this.addPhoto(t.ref, t.data.kind, t.data.data); } await this.purgeTrash([t.id]); },
      async purgeTrash(ids) { const s = new Set(ids); const T = lsGet('ra-demo-trash', []).filter((t) => !s.has(t.id)); lsSet('ra-demo-trash', T); trSubs.forEach((f) => f(T.slice())); },
      subscribeKpi(cb) { kpiSubs.add(cb); cb(lsGet('ra-demo-kpi', null)); return () => kpiSubs.delete(cb); },

  // ---------- 저장소: Firebase (Netlify 배포용, 실시간) ----------
  function FirebaseStore() {
    const C = CFG.collections; let fb, auth, db, me = null;
    const email = (empNo) => `${String(empNo).trim().toLowerCase()}@${CFG.empDomain}`;
    return {
      live: true,
      async init() {
        const v = '10.12.2';
        await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
        await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`);
        await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
        fb = window.firebase; fb.initializeApp(CFG.firebase); auth = fb.auth(); db = fb.firestore();
      },
      onAuth(cb) {
        auth.onAuthStateChanged(async (u) => {
          if (!u) { me = null; cb(null); return; }
          try {
            const d = await db.collection(C.users).doc(u.uid).get();
            if (!d.exists || d.data().role === 'disabled') { toast('등록되지 않았거나 사용 중지된 계정입니다'); await auth.signOut(); return; }
            me = Object.assign({ uid: u.uid }, d.data()); cb(me);
          } catch (e) { toast('계정 정보를 읽지 못했습니다: ' + e.message); cb(null); }
        });
      },
      async login(empNo, pw) { await auth.signInWithEmailAndPassword(email(empNo), pw); },
      async logout() { await auth.signOut(); },
      async changePassword(pw) { await auth.currentUser.updatePassword(pw); },
      async needsBootstrap() { try { const d = await db.collection(C.meta).doc('bootstrap').get(); return !d.exists; } catch (e) { return false; } },
      async bootstrap(empNo, name, pw) {
        const cred = await auth.createUserWithEmailAndPassword(email(empNo), pw);
        const b = db.batch();
        b.set(db.collection(C.meta).doc('bootstrap'), { by: cred.user.uid, at: fb.firestore.FieldValue.serverTimestamp() });
        b.set(db.collection(C.users).doc(cred.user.uid), { empNo, name, team: 'SHE팀', role: 'admin' });
        try { await b.commit(); } catch (e) { await cred.user.delete(); throw e; }
        location.reload();
      },
      subscribeUsers(cb) { return db.collection(C.users).onSnapshot((s) => cb(s.docs.map((d) => Object.assign({ uid: d.id }, d.data())))); },
      async createUser({ empNo, name, team, role, pw }) {
        const sec = fb.apps.find((a) => a.name === 'sec') || fb.initializeApp(CFG.firebase, 'sec');
        const cred = await sec.auth().createUserWithEmailAndPassword(email(empNo), pw);
        await sec.auth().signOut();
        await db.collection(C.users).doc(cred.user.uid).set({ empNo, name, team, role });
      },
      async updateUser(id, patch) { await db.collection(C.users).doc(id).update(patch); },
      subscribeItems(cb) { return db.collection(C.items).onSnapshot((s) => cb(s.docs.map((d) => Object.assign({ id: d.id }, d.data()))), (e) => toast('데이터 수신 오류: ' + e.message)); },
      async addItem(it) { const r = await db.collection(C.items).add(Object.assign({ createdAt: Date.now(), createdBy: me && me.uid }, it)); return r.id; },
      async updateItem(id, patch) { await db.collection(C.items).doc(id).update(Object.assign({}, patch, { updatedAt: Date.now(), updatedBy: me && me.uid })); },
      async deleteItems(ids) { for (let i = 0; i < ids.length; i += 400) { const b = db.batch(); ids.slice(i, i + 400).forEach((id) => b.delete(db.collection(C.items).doc(id))); await b.commit(); } },
      async bulkAdd(arr, onProg) {
        for (let i = 0; i < arr.length; i += 400) {
          const b = db.batch();
          arr.slice(i, i + 400).forEach((it) => b.set(it.id ? db.collection(C.items).doc(it.id) : db.collection(C.items).doc(), Object.assign({ createdAt: Date.now(), createdBy: me && me.uid }, it)));
          await b.commit(); onProg && onProg(Math.min(arr.length, i + 400), arr.length);
        }
      },
      async getPhotos(id) {
        const out = { before: [], after: [] };
        const leg = await db.collection(C.photos).doc(id).get();
        if (leg.exists) { const d = leg.data(); ['before', 'after'].forEach((k) => { if (typeof d[k] === 'string' && d[k]) out[k].push({ pid: 'legacy:' + k, data: d[k] }); }); }
        const q = await db.collection(C.photos).where('item', '==', id).get();
        q.docs.map((d) => Object.assign({ pid: d.id }, d.data())).sort((a, b) => (a.at || 0) - (b.at || 0)).forEach((v) => (out[v.kind] || out.before).push({ pid: v.pid, data: v.data }));
        return out;
      },
      async addPhoto(id, kind, data) { await db.collection(C.photos).add({ item: id, kind, data, at: Date.now(), by: me && me.uid }); },
      async deletePhoto(id, pid) { if (pid.startsWith('legacy:')) await db.collection(C.photos).doc(id).update({ [pid.slice(7)]: fb.firestore.FieldValue.delete() }); else await db.collection(C.photos).doc(pid).delete(); },
      subscribeAcc(cb) { return db.collection(C.acc || 'ra_acc').onSnapshot((s) => cb(s.docs.map((d) => Object.assign({}, d.data(), { id: d.id }))), (e) => { cb([]); toast('안전사고 수신 오류: ' + e.message); }); },
      async saveAcc(a) { const { id, ...d } = a; d.updatedAt = Date.now(); d.updatedBy = me && me.uid; if (id) { await db.collection(C.acc || 'ra_acc').doc(id).set(d); return id; } const r = await db.collection(C.acc || 'ra_acc').add(d); return r.id; },
      async deleteAcc(id) { await db.collection(C.acc || 'ra_acc').doc(id).delete(); },
      async bulkAcc(arr) { for (let i = 0; i < arr.length; i += 400) { const b = db.batch(); arr.slice(i, i + 400).forEach(({ id, ...d }) => b.set(id ? db.collection(C.acc || 'ra_acc').doc(id) : db.collection(C.acc || 'ra_acc').doc(), Object.assign({ createdAt: Date.now() }, d))); await b.commit(); } },
      subscribeLogs(cb) { return db.collection(C.logs || 'ra_logs').orderBy('at', 'desc').limit(1000).onSnapshot((s) => cb(s.docs.map((d) => Object.assign({ id: d.id }, d.data()))), () => cb([])); },
      async addLog(e) { await db.collection(C.logs || 'ra_logs').add(e); },
      subscribeTrash(cb) { return db.collection(C.trash || 'ra_trash').onSnapshot((s) => cb(s.docs.map((d) => Object.assign({}, d.data(), { id: d.id }))), () => cb([])); },
      async addTrashMany(arr) { for (let i = 0; i < arr.length; i += 50) { const b = db.batch(); arr.slice(i, i + 50).forEach((t) => b.set(db.collection(C.trash || 'ra_trash').doc(), t)); await b.commit(); } },
      async addTrash(t) { await db.collection(C.trash || 'ra_trash').add(t); },
      async restoreTrash(t) {
        if (t.kind === 'item') await db.collection(C.items).doc(t.ref).set(t.data);
        else if (t.kind === 'acc') await db.collection(C.acc || 'ra_acc').doc(t.ref).set(t.data);
        else if (t.kind === 'photo') await db.collection(C.photos).add({ item: t.data.item, kind: t.data.kind, data: t.data.data, at: Date.now(), by: me && me.uid });
        await db.collection(C.trash || 'ra_trash').doc(t.id).delete();
      },
      async purgeTrash(ids) { for (let i = 0; i < ids.length; i += 400) { const b = db.batch(); ids.slice(i, i + 400).forEach((id) => b.delete(db.collection(C.trash || 'ra_trash').doc(id))); await b.commit(); } },
      subscribeKpi(cb) { return db.collection(C.meta).doc('kpi').onSnapshot((d) => { let v = null; if (d.exists && typeof d.data().json === 'string') { try { v = JSON.parse(d.data().json); } catch (e) {} } cb(v); }, () => cb(null)); },
      async saveKpi(doc) { await db.collection(C.meta).doc('kpi').set({ json: JSON.stringify(doc), updatedAt: Date.now(), by: me && me.uid }); },
      subscribeReg(cb) { return db.collection(C.meta).doc('regulation').onSnapshot((d) => { let v = d.exists ? d.data() : null; if (v && typeof v.json === 'string') { try { v = JSON.parse(v.json); } catch (e) { v = null; } } cb(v); }, (e) => toast('관리규정 수신 오류: ' + e.message)); },
      async saveReg(doc) { const json = JSON.stringify(doc); if (json.length > 900000) throw new Error('관리규정 글이 너무 깁니다(1MB 한도). 사진은 사진 칸으로 올려 주세요'); await db.collection(C.meta).doc('regulation').set({ json, v: 2, updatedAt: Date.now() }); },
      subscribeRegImgs(cb) { return db.collection(C.regimg || 'ra_regimg').onSnapshot((s) => { const o = {}; s.forEach((d) => (o[d.id] = d.data().data)); cb(o); }, () => cb({})); },
      async setRegImg(id, data) { await db.collection(C.regimg || 'ra_regimg').doc(id).set({ data }); },
    };
  }

  const LIVE = !!(CFG.firebase && CFG.firebase.apiKey);
  const store = LIVE ? FirebaseStore() : DemoStore();

  // ---------- 상태 ----------
  const S = {
    user: null, items: [], users: [], view: lsGet('ra-view', 'dash'),
    M: lsGet('ra-M', Math.max(1, NOW_M - 1)), more: lsGet('ra-more', false),
    f: Object.assign({ status: 'open', team: '', dept: '', owner: '', m: '', hi: false, q: '' }, lsGet('ra-filter', {})),
    regMonth: NOW_M, regZone: '', editId: null, preview: null,
    dtype: lsGet('ra-dtype', '상시'), reg: null, regImgs: {}, Y: CUR_Y, lv: lsGet('ra-lv', 'table'),
  };
  const itemYear = RA.itemYear;
  // 보는 연도 항목 + 전년도 미결 이월(그 해 개선된 이월 항목 포함)
  function yearItems() {
    const Y = S.Y;
    return realItems().flatMap((x) => {
      const y = itemYear(x);
      if (y === Y) return [x];
      if (y < Y && x.status !== 'excluded' && (x.status === 'open' || (x.status === 'done' && RA.doneYear(x) === Y))) return [Object.assign({}, x, { _carry: true })];
      return [];
    });
  }
  function setYear(y) {
    S.Y = y; NOW_M = y < CUR_Y ? 12 : TODAY.getMonth() + 1;
    S.M = y < CUR_Y ? 12 : Math.max(1, NOW_M - 1); S.regMonth = y < CUR_Y ? 12 : NOW_M;
    renderYearSel(); render();
  }
  function renderYearSel() {
    const sel = $('#sel-year'); if (!sel) return;
    const ys = [...new Set([CUR_Y, ...realItems().map(itemYear)])].filter((y) => y <= CUR_Y).sort((a, b) => b - a);
    sel.innerHTML = ys.map((y) => `<option value="${y}" ${y === S.Y ? 'selected' : ''}>${y}년${y === CUR_Y ? ' (진행 중)' : ''}</option>`).join('');
    sel.onchange = () => setYear(+sel.value);
    const yb = $('#year-banner'); if (yb) { yb.hidden = S.Y === CUR_Y; yb.innerHTML = `${S.Y}년 기록을 보고 있습니다. <button class="btn sm" id="yb-back">${CUR_Y}년으로</button>`; const bb = $('#yb-back'); if (bb) bb.onclick = () => setYear(CUR_Y); }
  }
  const isRoutine = (x) => (x.type || '상시') === '상시';
  const typeOf = (x) => x.type || '상시';
  // also: 상시 항목을 정기 위험성평가 결과로도 함께 집계 (항목은 하나, 조치·사진 공유)
  const typeIs = (x, t) => typeOf(x) === t || (Array.isArray(x.also) && x.also.includes(t));
  const typeLabel = (x) => [typeOf(x), ...((x.also || []).filter((t) => t !== typeOf(x)))].join('+');
  const REG = () => S.reg || window.REG_SEED;
  RA.setCriteria(REG());
  const isAdmin = () => S.user && S.user.role === 'admin';
  const isSup = () => S.user && S.user.role === 'supervisor';
  const canCreate = () => isAdmin() || isSup();
  const canEdit = (it) => isAdmin() || (isSup() && it.team === S.user.team);
  const CTL_KEYS = RA.CTLS.map((c) => c[0]);
  const ctlOf = (x) => (Array.isArray(x.ctl) ? x.ctl.filter((k) => CTL_KEYS.includes(k)) : []);
  const ctlNo = (k) => '①②③④'[CTL_KEYS.indexOf(k)] || '';
  function ctlTags(x, emptyTxt) { const c = ctlOf(x); return c.length ? `<span class="ctags">${CTL_KEYS.filter((k) => c.includes(k)).map((k) => `<span class="ctag c${CTL_KEYS.indexOf(k)}">${ctlNo(k)} ${k}</span>`).join('')}</span>` : (emptyTxt == null ? '<span class="ctag none">유형 미지정</span>' : emptyTxt); }
  function ctlPicker(name, sel, sug) { return `<div class="ctlpick" role="group" aria-label="감소대책 유형">${RA.CTLS.map(([k, l, d], i) => `<label class="cp c${i} ${sug === k ? 'sug' : ''}" title="${esc(d)}"><input type="checkbox" name="${name}" value="${k}" ${sel.includes(k) ? 'checked' : ''}><span><b>${esc(l)}</b><small>${esc(d)}</small></span>${sug === k ? '<em>추천</em>' : ''}</label>`).join('')}</div>`; }
  const canAct = (it) => canEdit(it) || (isSup() && it.dept === S.user.team);
  const canDelete = (it) => isAdmin() || (isSup() && it.team === S.user.team && it.status === 'open');
  const zoneName = (id) => (RA.ZONES.find((z) => z.id === id) || {}).name || '';
  const realItems = () => S.items.filter((x) => x.kind !== 'nil' && x.kind !== 'meeting');
  const meetings = () => S.items.filter((x) => x.kind === 'meeting' && itemYear(x) === S.Y).sort((a, b) => String(a.date).localeCompare(String(b.date)));

  function levelPill(r) {
    if (r == null) return '<span class="small">–</span>';
    const g = RA.grade(r); if (!g) return `<span class="num">${r}</span>`;
    return `<span class="pill ${g.cls}" title="${esc(g.name)} · ${esc(g.allow)}${g.action ? ' — ' + esc(g.action) : ''}"><span class="num">${r}</span> ${esc(g.name.replace(/\s*위험$/, ''))}</span>`;
  }
  const typePill = (x) => (typeLabel(x) === '상시' ? '' : `<div><span class="pill ${typeOf(x) === '수시' ? 'p-hi' : 'p-ex'}">${typeLabel(x)}</span></div>`);
  function statusPill(it) {
    if (it.status === 'done') return `<span class="pill p-done">✓ 개선완료${it.doneM ? ` · ${it.doneM}월` : ''}</span>`;
    if (it.status === 'excluded') return '<span class="pill p-ex">제외</span>';
    const d = RA.openDays(it, TODAY);
    return d >= LONG_DAYS ? `<span class="pill p-hi">미결 · ${d}일</span>` : `<span class="pill p-open">미결 · ${d}일</span>`;
  }

  // ---------- 눌러서 이동 ----------
  function goAct(patch, lv) {
    S.f = Object.assign({ status: 'open', team: '', dept: '', owner: '', m: '', hi: false, q: '', type: '', carry: false, ph: false, hz: '', ctl: '', long: false }, patch);
    lsSet('ra-filter', S.f); if (lv) { S.lv = lv; lsSet('ra-lv', lv); }
    setView('act'); window.scrollTo(0, 0);
  }
  function goDash(dtype, anchor) {
    if (dtype) { S.dtype = dtype; lsSet('ra-dtype', dtype); }
    if (anchor) { S.more = true; lsSet('ra-more', true); }
    setView('dash');
    if (anchor) setTimeout(() => { const el = $('#' + anchor); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' }); }, 60);
  }
  // ---------- 화면 전환 ----------
  function setView(v) {
    if (v === 'admin' && !isAdmin()) v = 'dash';
    if (!['dash', 'reg', 'act', 'acc', 'admin', 'rule'].includes(v)) v = 'dash';
    S.regDirty = false; if (v !== 'reg') S.accLink = null;
    S.view = v; lsSet('ra-view', v);
    $$('#tabs .tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.v === v)));
    $$('.view').forEach((s) => (s.hidden = s.id !== 'v-' + v));
    render();
  }
  const goHome = () => { setView('dash'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  $('#brand-home').addEventListener('click', goHome);
  $('#tabs').addEventListener('click', (e) => { const t = e.target.closest('.tab'); if (t) setView(t.dataset.v); });
  function render() {
    if (!S.user) return;
    if (S.view === 'dash') renderDash();

      ${typeCards()}

        <button type="button" data-kgo="cur" class="kpi clk"><div class="kpi-l"><span class="dot" style="background:var(--s1)"></span>당월 발굴</div><div class="kpi-v">${t.cur}<small>건</small></div><div class="kpi-s">당월 개선 ${t.curDone}건</div></button>
        <button type="button" data-kgo="cum" class="kpi clk"><div class="kpi-l">누계 발굴</div><div class="kpi-v">${t.cum}<small>건</small></div><div class="kpi-s">1~${M}월 · 제외 ${t.ex}건</div></button>
        <button type="button" data-kgo="done" class="kpi clk"><div class="kpi-l"><span class="dot" style="background:var(--s2)"></span>누계 개선</div><div class="kpi-v">${t.cumDone}<small>건</small></div><div class="kpi-s">개선율 ${rate.toFixed(1)}%</div><div class="bar"><i style="width:${Math.min(100, rate)}%"></i></div></button>
        <button type="button" data-kgo="open" class="kpi clk"><div class="kpi-l">미결</div><div class="kpi-v">${t.open}<small>건</small></div><div class="kpi-s">${t.carryOpen ? `전년 이월 ${t.carryOpen}건 포함` : '조치 관리에서 확인'}</div></button>
        <button type="button" data-kgo="hi" class="kpi clk ${t.hiOpen ? 'alert' : ''}"><div class="kpi-l">중대 위험 이상 미결</div><div class="kpi-v">${t.hiOpen}<small>건</small></div><div class="kpi-s">위험성 ${RA.highMin()} 이상 · 조건부/작업 불허용</div></button>

      <div class="grid2b">
        <div class="card"><div class="card-h"><h2>${M}월 ${tlabel}</h2><div class="legend"><span><i class="sw" style="background:var(--s1)"></i>발굴</span><span><i class="sw" style="background:var(--s2)"></i>개선</span></div></div>
          ${teamBars(sum.rows, [(r) => r.cur, (r) => r.curDone], ['var(--s1)', 'var(--s2)'], ['발굴', '개선'])}
          ${teamTable(sum, [['발굴', (r) => r.cur], ['개선', (r) => r.curDone]])}</div>
        <div class="card"><div class="card-h"><h2>누계 ${tlabel}</h2><span class="sub">1~${M}월 · 개선율 = 완료 ÷ 합계</span><div class="legend"><span><i class="sw" style="background:var(--s2)"></i>완료</span><span><i class="sw" style="background:var(--s3)"></i>미완료</span></div></div>
          ${teamBars(sum.rows, [(r) => r.cumDone, (r) => r.cum - r.cumDone - r.ex], ['var(--s2)', 'var(--s3)'], ['완료', '미완료'])}
          ${teamTable(sum, [['완료', (r) => r.cumDone], ['미완료', (r) => r.cum - r.cumDone - r.ex, true], ['제외', (r) => r.ex], ['합계', (r) => r.cum], ['개선율', (r) => (r.cum ? Math.round((r.cumDone / r.cum) * 100) + '%' : '–')]])}</div>
      </div>
      <div class="grid2b">
        <div class="card"><div class="card-h"><h2>월별 발굴 · 개선</h2><div class="legend"><span><i class="sw" style="background:var(--s1)"></i>발굴</span><span><i class="sw" style="background:var(--s2)"></i>개선(완료월 기준)</span></div></div>${monthChart(sum)}</div>
        <div class="card"><div class="card-h"><h2>누계 개선율 추이</h2><span class="sub">월말 기준 완료 ÷ 누계 발굴</span></div>${rateChart(items, M)}
          ${t.carryOpen + t.carryDone ? `<div class="notice info" style="margin-top:10px">전년도 이월 미결 <b class="num">${t.carryOpen}건</b> · 올해 이월분 개선 <b class="num">${t.carryDone}건</b> <button class="btn sm" id="go-carry">이월 항목 보기</button></div>` : ''}</div>
